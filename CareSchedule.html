    ${plan.warnings.length ? `<p class="under">Check:</p>${list(plan.warnings)}` : ''}
    <div class="toolbar">
      ${changes ? `<button class="btn primary" data-action="importApply">Import ${changes} carer(s)</button>` : ''}
      <button class="btn" data-action="importCancel">${changes ? 'Cancel' : 'Close'}</button>
    </div>
  </div>`;
}

// ---------- Carers ----------
function blankCarer(agency) {
  return { id: uid(), name: '', gender: 'F', driver: false, daysPerWeek: 5, overtime: false, runTypes: 'both', available: DAYS.map(() => true), leave: [], notes: '', active: true, agency: !!agency };
}

function viewCarers() {
  const hist = history(state, ui.week);
  const row = c => {
    const today = todayIso();
    const current = (c.leave || []).filter(l => (l.to || l.from) >= today).map(l => `${{ AL: 'AL', SICK: 'Sick', REQ: 'Request' }[l.type] || l.type} ${fmtDate(l.from)}${l.to && l.to !== l.from ? '–' + fmtDate(l.to) : ''}`).join('<br>');
    return `<tr class="${c.active === false ? 'muted' : ''}">
      <td>${esc(c.name)}${c.active === false ? ' (inactive)' : ''}${traineeTag(c)}${!c.agency && weekendStreak(hist[c.id]) >= 2 ? ' <span class="tag flag">⚑ Weekend off priority</span>' : ''}
        ${notWithNames(c) ? `<br><span class="muted">Not with: ${esc(notWithNames(c))}</span>` : ''}</td>
      <td><span class="tag ${c.gender}">${c.gender === 'M' ? 'Male' : 'Female'}</span></td>
      <td><span class="tag ${c.driver ? 'drv' : 'nodrv'}">${c.driver ? 'Driver' : 'Non-driver'}</span></td>
      <td>${c.daysPerWeek}${c.overtime ? ' + 1 overtime' : ''}</td>
      <td>${runTypesLabel(c)}${(c.preferredRuns || []).length ? `<br><span class="muted">${c.onlyPreferred ? 'Only' : 'Prefers'}: ${esc(preferredNames(c, state.runs))}</span>` : ''}</td>
      <td>${DAYS.filter((_, i) => c.available[i]).join(', ') || 'none'}${hasPattern(c) ? `<br><span class="muted">Usually: ${DAYS.filter((_, i) => c.pattern.days[i]).join(' ')}${Number(c.pattern.every) === 2 ? ', every other week' : ''}</span>` : ''}</td>
      <td>${current || '<span class="muted">none</span>'}</td>
      <td>${c.agency ? '<span class="muted">n/a</span>' : weekendBadge(weekendStreak(hist[c.id]))}</td>
      <td><button class="btn" data-action="editCarer" data-id="${c.id}">Edit</button>
          <button class="btn danger" data-action="delCarer" data-id="${c.id}">Remove</button></td></tr>`;
  };
  const regular = sortedCarers().filter(c => !c.agency);
  const agencyStaff = sortedCarers().filter(c => c.agency);
  const head = last => `<thead><tr><th>Name</th><th>Gender</th><th>Driver</th><th>${last ? 'Max days / week' : 'Days / week'}</th><th>Run types</th><th>Can work</th><th>Upcoming leave / sickness</th><th>${last ? 'Weekends' : `Weekends (w/c ${fmtDate(ui.week)})`}</th><th></th></tr></thead>`;
  return `
  ${importPanel()}
  ${ui.editCarer ? carerForm(ui.editCarer) : ''}
  <div class="panel">
    <div class="toolbar"><h3 style="margin:0;flex:1">Carers (${regular.length})</h3>
      <button class="btn" data-action="carerTemplate" title="A blank Excel sheet with the right columns and instructions">Download Excel template</button>
      <button class="btn" data-action="carerExport" title="Your current carers in the same layout – edit in Excel and import again">Download carers (Excel)</button>
      <label class="btn">Import from Excel <input type="file" id="importCarers" accept=".xlsx,.csv" hidden></label>
      <button class="btn primary" data-action="newCarer">+ Add carer</button></div>
    <table>${head(false)}
    <tbody>${regular.map(row).join('') || '<tr><td colspan="9" class="muted">No carers yet.</td></tr>'}</tbody></table>
  </div>
  <div class="panel">
    <div class="toolbar"><h3 style="margin:0;flex:1">Agency staff (${agencyStaff.length})</h3>
      <button class="btn primary" data-action="newAgency">+ Add agency worker</button></div>
    <p class="muted" style="margin-top:0">Agency staff are only used to fill shifts no regular carer can cover, after everything else is done.
      They never take a shift from a regular carer and don't affect regular carers' weekends, run rotation or days off.</p>
    <table>${head(true)}
    <tbody>${agencyStaff.map(row).join('') || '<tr><td colspan="9" class="muted">No agency staff added.</td></tr>'}</tbody></table>
  </div>`;
}

// names of everyone this carer can't work with (set on either carer)
function notWithNames(c) {
  return sortedCarers().filter(o => cantPair(c, o)).map(o => o.name).join(', ');
}

function carerForm(c) {
  const leave = c.leave.map((l, i) => `
    <div class="row" data-leave="${i}">
      <select data-f="ltype">${leaveTypeOptions(l.type)}</select>
      <label>From <input type="date" data-f="lfrom" value="${l.from || ''}"></label>
      <label>To <input type="date" data-f="lto" value="${l.to || ''}"></label>
      <button class="btn danger" data-action="delLeave" data-i="${i}">Remove</button>
    </div>`).join('');
  return `
  <div class="panel" id="carerForm">
    <h3 style="margin-top:0">${state.carers.some(x => x.id === c.id) ? 'Edit' : 'New'} ${c.agency ? 'agency worker' : 'carer'}</h3>
    <div class="row">
      <label>Name <input data-f="name" value="${esc(c.name)}" size="24"></label>
      <label>Gender <select data-f="gender"><option value="F" ${c.gender === 'F' ? 'selected' : ''}>Female</option><option value="M" ${c.gender === 'M' ? 'selected' : ''}>Male</option></select></label>
      <label><input type="checkbox" data-f="driver" ${c.driver ? 'checked' : ''}> Driver</label>
      <label>${c.agency ? 'Max days per week' : 'Days per week'} <input type="number" min="0" max="7" data-f="daysPerWeek" value="${c.daysPerWeek}" style="width:60px"></label>
      <label ${c.agency ? 'hidden' : ''}><input type="checkbox" data-f="overtime" ${c.overtime ? 'checked' : ''}> Agreed +1 overtime day</label>
      <label><input type="checkbox" data-f="agency" ${c.agency ? 'checked' : ''}> Agency</label>
      <label>Can go on <select data-f="runTypes">
        <option value="both" ${!c.runTypes || c.runTypes === 'both' ? 'selected' : ''}>Double-ups and singles</option>
        <option value="double" ${c.runTypes === 'double' ? 'selected' : ''}>Double-ups only</option>
        <option value="single" ${c.runTypes === 'single' ? 'selected' : ''}>Singles only</option></select></label>
      <label><input type="checkbox" data-f="active" ${c.active !== false ? 'checked' : ''}> Active</label>
    </div>
    <div class="row"><label>Trainee – only shadows experienced carers until <input type="date" data-f="traineeUntil" value="${c.traineeUntil || ''}"></label>
      <span class="muted">leave blank if not a new starter; after this date they work normally</span>
    </div>
    <div class="row" style="align-items:flex-start"><b>Preferred runs:</b>
      <details><summary>${esc(preferredNames(c, state.runs) || 'None – choose…')}</summary>
        ${state.runs.map(r => `<label style="display:block"><input type="checkbox" data-f="preferredRuns" data-r="${r.id}" ${(c.preferredRuns || []).includes(r.id) ? 'checked' : ''}> ${esc(r.name)}</label>`).join('')}
      </details>
      <label><input type="checkbox" data-f="onlyPreferred" ${c.onlyPreferred ? 'checked' : ''}> Only these runs</label>
      <span class="muted">auto-fill puts them on their preferred runs first; tick "Only these runs" to never use them anywhere else</span></div>
    <div class="row days"><b>Usually works:</b> ${DAYS.map((d, i) => `<label><input type="checkbox" data-f="pat" data-i="${i}" ${c.pattern && c.pattern.days[i] ? 'checked' : ''}>${d}</label>`).join('')}
      <select data-f="patEvery"><option value="1" ${!c.pattern || Number(c.pattern.every) !== 2 ? 'selected' : ''}>every week</option>
        <option value="2" ${c.pattern && Number(c.pattern.every) === 2 ? 'selected' : ''}>every other week, starting</option></select>
      <input type="date" data-f="patFrom" value="${(c.pattern && c.pattern.from) || ui.week}">
      <span class="muted">optional – auto-fill puts them on these days first</span></div>
    <div class="row days"><b>Days they can work:</b> ${DAYS.map((d, i) => `<label><input type="checkbox" data-f="avail" data-i="${i}" ${c.available[i] ? 'checked' : ''}>${d}</label>`).join('')}</div>
    <div class="row" style="align-items:flex-start"><b>Can't work with:</b>
      <details><summary>${esc(sortedCarers().filter(o => o.id !== c.id && (c.notWith || []).includes(o.id)).map(o => o.name).join(', ') || 'No one – choose…')}</summary>
        ${sortedCarers().filter(o => o.id !== c.id).map(o => `<label style="display:block"><input type="checkbox" data-f="notWith" data-c="${o.id}" ${(c.notWith || []).includes(o.id) ? 'checked' : ''}> ${esc(o.name)}</label>`).join('')}
      </details>
      <span class="muted">never put on the same run on the same day (applies both ways)</span></div>
    <div class="row"><label>Notes <input data-f="notes" value="${esc(c.notes || '')}" size="60"></label></div>
    <div><b>Annual leave / sickness / day-off requests</b> <span class="muted">– auto-fill won't use them on leave or sickness dates (you can still assign by hand with an override);
      a day-off request is avoided wherever cover allows</span></div>
    ${leave}
    <div class="toolbar" style="margin-top:8px">
      <button class="btn" data-action="addLeave">+ Add leave / sickness</button>
      <span style="flex:1"></span>
      <button class="btn" data-action="cancelCarer">Cancel</button>
      <button class="btn primary" data-action="saveCarer">Save carer</button>
    </div>
  </div>`;
}

function readCarerForm() {
  const f = document.getElementById('carerForm');
  const c = ui.editCarer;
  const val = sel => f.querySelector(`[data-f="${sel}"]`);
  c.name = val('name').value.trim();
  c.gender = val('gender').value;
  c.driver = val('driver').checked;
  c.daysPerWeek = Math.max(0, Math.min(7, Number(val('daysPerWeek').value) || 0));
  c.overtime = val('overtime').checked;
  c.runTypes = val('runTypes').value;
  c.agency = val('agency').checked;
  if (c.agency) c.overtime = false;
  c.preferredRuns = [...f.querySelectorAll('[data-f="preferredRuns"]:checked')].map(x => x.dataset.r);
  c.onlyPreferred = val('onlyPreferred').checked;
  c.active = val('active').checked;
  c.traineeUntil = val('traineeUntil').value || undefined;
  c.notes = val('notes').value;
  c.notWith = [...f.querySelectorAll('[data-f="notWith"]:checked')].map(x => x.dataset.c);
  c.available = DAYS.map((_, i) => f.querySelector(`[data-f="avail"][data-i="${i}"]`).checked);
  const pat = DAYS.map((_, i) => f.querySelector(`[data-f="pat"][data-i="${i}"]`).checked);
  c.pattern = pat.some(Boolean) ? { days: pat, every: Number(val('patEvery').value), from: mondayOf(val('patFrom').value || ui.week) } : undefined;
  c.leave = [...f.querySelectorAll('[data-leave]')].map(row => {
    const from = row.querySelector('[data-f="lfrom"]').value;
    const to = row.querySelector('[data-f="lto"]').value || from;
    return { type: row.querySelector('[data-f="ltype"]').value, from, to: to < from ? from : to };
  });
}

// ---------- Runs ----------
function viewRuns() {
  const rows = state.runs.map((r, i) => `
    <tr>
      <td><input data-action="runField" data-f="name" data-id="${r.id}" value="${esc(r.name)}"></td>
      <td><select data-action="runField" data-f="type" data-id="${r.id}">
        <option value="double" ${r.type === 'double' ? 'selected' : ''}>Double up (2 carers)</option>
        <option value="single" ${r.type !== 'double' ? 'selected' : ''}>Single (1 carer)</option></select></td>
      <td><select data-action="runField" data-f="gender" data-id="${r.id}">
        <option value="any" ${r.gender === 'any' ? 'selected' : ''}>Male or female</option>
        <option value="M" ${r.gender === 'M' ? 'selected' : ''}>Male only</option>
        <option value="F" ${r.gender === 'F' ? 'selected' : ''}>Female only</option></select></td>
      <td><label><input type="checkbox" data-action="runFlag" data-f="needsDriver" data-id="${r.id}" ${needsDriver(r) ? 'checked' : ''}> Needs a driver</label></td>
      <td><details ${ui.openAllowed === r.id ? 'open' : ''} data-id="${r.id}"><summary>${isSpecific(r) ? esc(r.allowed.map(id => (byId(id) || {}).name).filter(Boolean).join(', ')) : 'Anyone'}</summary>
        ${sortedCarers().map(c => `<label style="display:block"><input type="checkbox" data-action="runAllowed" data-id="${r.id}" data-c="${c.id}" ${(r.allowed || []).includes(c.id) ? 'checked' : ''}> ${esc(c.name)} (${c.gender}${c.driver ? ', D' : ''})</label>`).join('')}
      </details></td>
      <td class="days">${DAYS.map((d, j) => `<label><input type="checkbox" data-action="runDay" data-id="${r.id}" data-i="${j}" ${r.days[j] ? 'checked' : ''}>${d}</label>`).join('')}</td>
      <td style="white-space:nowrap">
        <button class="btn" data-action="runUp" data-i="${i}" ${i === 0 ? 'disabled' : ''}>▲</button>
        <button class="btn" data-action="runDown" data-i="${i}" ${i === state.runs.length - 1 ? 'disabled' : ''}>▼</button>
        <button class="btn danger" data-action="delRun" data-id="${r.id}">Remove</button></td>
    </tr>`).join('');
  return `
  <div class="panel">
    <div class="toolbar"><h3 style="margin:0;flex:1">Runs (${state.runs.length})</h3>
      <button class="btn primary" data-action="newRun">+ Add run</button></div>
    <p class="muted" style="margin-top:0">Changes save automatically. Untick a day if the run doesn't operate that day.
      Use "Only these carers" to limit a run to named carers – those runs are filled first, and their carers are kept for them.</p>
    <table><thead><tr><th>Name</th><th>Type</th><th>Gender</th><th>Driver</th><th>Only these carers</th><th>Operates</th><th></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="7" class="muted">No runs yet.</td></tr>'}</tbody></table>
  </div>`;
}

// ---------- Leave planner ----------
function viewLeave() {
  const f = ui.leaveForm || { carer: '', type: 'AL', from: '', to: '' };
  const regulars = sortedCarers().filter(c => c.active !== false && !c.agency);
  const impact = ui.leaveCheck;
  const verdict = impact ? `
    <div class="panel ${impact.problemDays ? 'sick' : 'cover'}" style="margin-top:8px">
      <h3 style="margin-top:0">${impact.problemDays
        ? `⚠ ${impact.problemDays} day(s) would be short of staff`
        : '✔ Cover looks fine for these dates'}</h3>
      <div class="muted" style="margin-bottom:6px">An estimate: each available carer counts as their share of the week (days per week ÷ days available).
        Agency staff aren't counted. Already off: shown for each day.</div>
      <table class="leavecheck"><thead><tr><th>Day</th><th>Carers likely around / shifts</th><th>Problems</th><th>Already off</th></tr></thead><tbody>
      ${impact.days.map(x => `<tr class="${x.short.length ? 'err' : ''}"><td>${DAYS[(new Date(x.date + 'T12:00:00Z').getUTCDay() + 6) % 7]} ${fmtDate(x.date)}</td>
        <td>${(Math.round(x.expected * 10) / 10)} / ${x.shifts}</td><td>${esc(x.short.join('; ')) || '—'}</td><td>${esc(x.off.join(', ')) || '—'}</td></tr>`).join('')}
      </tbody></table>
      <div class="toolbar" style="margin-top:8px">
        <button class="btn primary" data-action="leaveAdd">${impact.problemDays ? 'Add leave anyway' : 'Add leave'}</button>
        <button class="btn" data-action="leaveCancel">Cancel</button>
      </div>
    </div>` : '';

  // calendar: who is off over the next weeks, with days likely to be short highlighted
  const n = ui.leaveWeeks, start = ui.week, end = addDays(start, 7 * n - 1);
  const dates = Array.from({ length: 7 * n }, (_, i) => addDays(start, i));
  const shortDays = new Set(leaveImpact(state, null, start, end).days.filter(x => x.short.length).map(x => x.date));
  const head = dates.map(dt => {
    const d = (new Date(dt + 'T12:00:00Z').getUTCDay() + 6) % 7;
    return `<th class="${shortDays.has(dt) ? 'short' : ''} ${d >= 5 ? 'we' : ''}" title="${shortDays.has(dt) ? 'Likely to be short of staff' : ''}">${DAYS[d][0]}<br>${dt.slice(8)}</th>`;
  }).join('');
  const rows = regulars.map(c => `<tr><th>${esc(c.name)}${c.agency ? ' <span class="muted">(agency)</span>' : ''}</th>${dates.map(dt => {
    const l = leaveOn(c, dt);
    const d = (new Date(dt + 'T12:00:00Z').getUTCDay() + 6) % 7;
    if (l) return `<td class="lv ${l.type === 'SICK' ? 'sk' : 'al'}" title="${l.type === 'SICK' ? 'Sickness' : 'Annual leave'}">${l.type === 'SICK' ? 'S' : 'AL'}</td>`;
    if (requestOn(c, dt)) return '<td class="lv rq" title="Day-off request">R</td>';
    if (!c.available[d]) return '<td class="lv na" title="Not available">–</td>';
    return `<td class="${d >= 5 ? 'we' : ''}"></td>`;
  }).join('')}</tr>`).join('');

  return `
  <div class="panel">
    <h3 style="margin-top:0">Book leave</h3>
    <div class="row" id="leaveForm">
      <label>Carer <select data-f="lvCarer"><option value="">Choose…</option>${regulars.map(c => `<option value="${c.id}" ${c.id === f.carer ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
      <label>Type <select data-f="lvType">${leaveTypeOptions(f.type)}</select></label>
      <label>From <input type="date" data-f="lvFrom" value="${f.from}"></label>
      <label>To <input type="date" data-f="lvTo" value="${f.to}"></label>
      <button class="btn primary" data-action="leaveCheck">Check cover</button>
    </div>
    <div class="muted">Check cover shows, day by day, whether there would still be enough carers, drivers and male / female staff before you add it.
      Leave can also be added on the carer's own page.</div>
    ${verdict}
  </div>
  <div class="panel">
    <div class="toolbar"><h3 style="margin:0;flex:1">Who's off – from w/c ${fmtDate(start)}</h3>
      <button class="btn" data-action="prevWeek">◀</button><button class="btn" data-action="nextWeek">▶</button>
      <label>Show <select id="leaveWeeks">${[4, 8, 13].map(k => `<option value="${k}" ${n === k ? 'selected' : ''}>${k} weeks</option>`).join('')}</select></label></div>
    <div class="legend"><span class="lvkey al">AL</span> annual leave <span class="lvkey sk">S</span> sickness <span class="lvkey rq">R</span> day-off request <span class="lvkey na">–</span> not available
      <span class="lvkey short">&nbsp;</span> day likely to be short of staff</div>
    <div class="grid-wrap"><table class="leavecal"><thead><tr><th>Carer</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

const LEAVE_TYPES = { AL: 'Annual leave', SICK: 'Sickness', REQ: 'Day-off request' };
function leaveTypeOptions(selected) {
  return Object.entries(LEAVE_TYPES).map(([k, v]) => `<option value="${k}" ${selected === k ? 'selected' : ''}>${v}</option>`).join('');
}

function readLeaveForm() {
  const f = document.getElementById('leaveForm');
  const v = k => f.querySelector(`[data-f="${k}"]`).value;
  ui.leaveForm = { carer: v('lvCarer'), type: v('lvType'), from: v('lvFrom'), to: v('lvTo') || v('lvFrom') };
  if (ui.leaveForm.to < ui.leaveForm.from) ui.leaveForm.to = ui.leaveForm.from;
  return ui.leaveForm;
}

// ---------- Reports ----------
function viewReports() {
  const n = ui.reportWeeks;
  const rep = fairnessReport(state, ui.week, n);
  const rows = rep.rows.filter(r => r.carer.active !== false).sort((a, b) => a.carer.name.localeCompare(b.carer.name));
  const avg = k => rows.length ? rows.reduce((t, r) => t + r[k], 0) / rows.length : 0;
  const avgWeekendShare = rows.length ? rows.reduce((t, r) => t + (r.weekendsTotal ? r.weekendsWorked / r.weekendsTotal : 0), 0) / rows.length : 0;
  const flag = (cond, text) => cond ? ` class="under" title="${text}"` : '';
  const table = rows.map(r => {
    const share = r.weekendsTotal ? r.weekendsWorked / r.weekendsTotal : 0;
    return `<tr><td>${esc(r.carer.name)}</td>
      <td>${r.days} / ${r.due}</td>
      <td${flag(r.short >= 3, 'Several days short of their profile')}>${r.short}</td>
      <td${flag(r.overtime >= 3, 'Several overtime days')}>${r.overtime}</td>
      <td${flag(r.weekendsTotal >= 3 && share - avgWeekendShare >= 0.2, 'Working more weekends than most')}>${r.weekendsWorked} of ${r.weekendsTotal}</td>
      <td${flag(r.longestWeekendRun >= 3, '3 or more weekends in a row')}>${r.longestWeekendRun}</td>
      <td>${r.sickDays}</td><td>${r.leaveDays}</td><td>${r.shadowDays || ''}</td></tr>`;
  }).join('');
  return `
  <div class="panel">
    <div class="toolbar"><h3 style="margin:0;flex:1">Fairness report – ${rep.weeks.length} week(s) with schedules, up to w/c ${fmtDate(ui.week)}</h3>
      <button class="btn" data-action="prevWeek">◀</button><button class="btn" data-action="nextWeek">▶</button>
      <label>Period <select id="reportWeeks">${[4, 8, 13, 26].map(k => `<option value="${k}" ${n === k ? 'selected' : ''}>last ${k} weeks</option>`).join('')}</select></label>
      <button class="btn" data-action="reportExcel">Download (Excel)</button></div>
    <p class="muted" style="margin-top:0">Amber = worth a look: 3+ days short of their profile, 3+ overtime days, a weekend share well above
      average, or 3+ weekends in a row. Averages: ${avg('days').toFixed(1)} days, ${avg('weekendsWorked').toFixed(1)} weekends, ${avg('overtime').toFixed(1)} overtime days.</p>
    ${rep.weeks.length ? `<div class="grid-wrap"><table><thead><tr><th>Carer</th><th>Days worked / due</th><th>Days short</th><th>Overtime days</th>
      <th>Weekends worked</th><th>Most weekends in a row</th><th>Sick days</th><th>Annual leave days</th><th>Shadow days</th></tr></thead>
      <tbody>${table}</tbody></table></div>` : '<p>No schedules in this period yet.</p>'}
  </div>`;
}

function downloadReport() {
  const rep = fairnessReport(state, ui.week, ui.reportWeeks);
  const rows = [['Carer', 'Days worked', 'Days due', 'Days short', 'Overtime days', 'Weekends worked', 'Weekends in period', 'Most weekends in a row', 'Sick days', 'Annual leave days', 'Shadow days']]
    .concat(rep.rows.filter(r => r.carer.active !== false).map(r => [r.carer.name, r.days, r.due, r.short, r.overtime, r.weekendsWorked, r.weekendsTotal, r.longestWeekendRun, r.sickDays, r.leaveDays, r.shadowDays]));
  download(`CareSchedule-fairness-${ui.week}.xlsx`, makeXlsx([{ name: 'Fairness', rows, widths: [24, 12, 10, 10, 13, 15, 17, 20, 10, 16, 12] }]),
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

// ---------- Settings ----------
function viewSettings() {
  const s = state.settings;
  return `
  <div class="panel">
    <h3 style="margin-top:0">Auto-fill rules</h3>
    <div class="row"><label>Organisation name <input id="orgName" value="${esc(s.orgName || '')}" size="30" placeholder="e.g. Sunrise Home Care"></label>
      <span class="muted">shown at the top of rotas you share with carers</span></div>
    <div class="row"><label>When choosing between carers, prefer
      <select id="genderPriority">
        <option value="M" ${s.genderPriority === 'M' ? 'selected' : ''}>Males first, then females</option>
        <option value="F" ${s.genderPriority === 'F' ? 'selected' : ''}>Females first, then males</option>
        <option value="none" ${s.genderPriority === 'none' ? 'selected' : ''}>No preference</option></select></label></div>
    <div class="row"><label><input type="checkbox" id="secondPassSetting" ${s.secondPass ? 'checked' : ''}> Do a second pass to fill gaps with spare carers (incl. spare drivers)</label></div>
    <div class="row"><label><input type="checkbox" id="useOvertime" ${s.useOvertime ? 'checked' : ''}> Second pass may use the agreed +1 overtime day</label></div>
    <div class="row"><label><input type="checkbox" id="useAgency" ${s.useAgency !== false ? 'checked' : ''}> Use agency staff to fill shifts no regular carer can cover</label></div>
    <div class="row"><label>Maximum days in a row <input type="number" min="0" max="13" id="maxInARow" value="${s.maxInARow}" style="width:60px"></label>
      <span class="muted">counts days worked at the end of last week (0 = no limit)</span></div>
    <p class="muted">Whenever a carer ends up working 6 or more days in a row (for example added by hand), the next 2 days are kept off
      for them, and going back sooner is flagged red.</p>
    <div class="row"><label><input type="checkbox" id="weekendRule" ${s.weekendRule !== false ? 'checked' : ''}> Weekends off: aim for every 2 weeks, never more than 2 weekends worked in a row</label></div>
    <p class="muted">Saturday and Sunday are planned first, then Monday to Friday. Order used each day: (0) runs limited to named carers,
      (1) a driver on every double-up, (2) second carer on double-ups (pass 1 uses non-drivers only, saving drivers),
      (3) a driver on every single run. Male-only / female-only runs are filled before mixed runs. Nobody is booked twice on the same day,
      nobody goes over their days per week, carers set to double-ups only or singles only are kept to those runs,
      and anyone on leave, sick or not available that day is skipped.</p>
    <p class="muted">Auto-fill looks back over the previous ${HISTORY_WEEKS} weeks (about 3 months) of schedules in this app.
      Anyone who worked last weekend is steered away from this one, so most people get a weekend off every 2 weeks; anyone who has worked
      the last 2 weekends is automatically flagged ⚑ Weekend off priority and kept off this one, so nobody goes past 3 weeks.
      The flag comes only from what people have worked, so everyone is treated the same.
      Carers are kept on the same 2 runs for ${ROTATION_WEEKS} weeks, then moved to a different pair; it also keeps days off together
      and is shuffled, so allocation is random rather than alphabetical. Fill weeks in date order so the history is right.</p>
  </div>
  <div class="panel">
    <h3 style="margin-top:0">Your data</h3>
    ${desktop ? `<p>Everything is saved automatically to:<br><code>${esc(deskInfo.file)}</code>
      ${deskInfo.cloud ? `<span class="tag drv">${esc(deskInfo.cloud)} ✓</span>` : ''}</p>
    <p class="muted">A copy is kept each day in the <b>backups</b> folder next to it (the last ${deskInfo.keep} days).</p>
    <p><b>Sharing with your office (Google Drive):</b> install <i>Google Drive for desktop</i> on each computer, then press
      <b>Change data folder…</b> and choose the same shared Drive folder on every computer. Only one computer can make changes at a time –
      the others see it view only, with who has it open, and update as they save.
      ${deskInfo.cloud ? '' : 'Right-click the folder in Drive and choose <i>Available offline</i> so it keeps working without internet.'}</p>`
    : `<p>Everything is stored on this computer only (in this browser) – no internet needed. Export a backup regularly, and use it to move data to another computer.</p>`}
    <div class="toolbar">
      ${desktop ? '<button class="btn" data-action="openDataFolder">Open data folder</button><button class="btn" data-action="chooseFolder">Change data folder…</button>' : ''}
      <button class="btn primary" data-action="backup">Export backup</button>
      <label class="btn">Import backup <input type="file" id="importFile" accept=".json,application/json" hidden></label>
      <button class="btn" data-action="sample">Load sample data</button>
      <button class="btn danger" data-action="reset">Delete all data</button>
    </div>
  </div>`;
}

function sampleData() {
  const s = newState();
  const all = DAYS.map(() => true);
  const mk = (name, gender, driver, days, extra) => Object.assign({ id: uid(), name, gender, driver, daysPerWeek: days, overtime: false, available: all.slice(), leave: [], notes: '', active: true }, extra || {});
  s.carers = [
    mk('Adam Brown', 'M', true, 5), mk('Ben Clarke', 'M', true, 4, { overtime: true }), mk('Chris Doyle', 'M', false, 5),
    mk('Dan Evans', 'M', true, 3, { available: [true, true, true, true, true, false, false] }),
    mk('Amy Hughes', 'F', true, 5), mk('Beth Jones', 'F', false, 5), mk('Cara King', 'F', true, 4, { overtime: true }),
    mk('Dawn Lewis', 'F', false, 4), mk('Emma Moore', 'F', true, 5), mk('Faye Norris', 'F', false, 3, { runTypes: 'double' }),
    mk('Gina Owen', 'F', true, 5, { leave: [{ type: 'AL', from: addDays(ui.week, 2), to: addDays(ui.week, 4) }] }),
    mk('Hana Price', 'F', false, 5), mk('Isla Reed', 'F', true, 4), mk('Jade Shaw', 'F', false, 5),
    mk('Kyle Turner', 'M', true, 5), mk('Lucy Vance', 'F', false, 4), mk('Mia Walsh', 'F', true, 5),
  ];
  s.carers.push(mk('Agency – Sam Young', 'M', true, 5, { agency: true }), mk('Agency – Zoe Fox', 'F', false, 5, { agency: true }));
  const pair = ['Amy Hughes', 'Ben Clarke'].map(n => s.carers.find(c => c.name === n));
  pair[0].notWith = [pair[1].id]; pair[1].notWith = [pair[0].id];
  const named = ['Beth Jones', 'Hana Price', 'Jade Shaw'].map(n => s.carers.find(c => c.name === n).id);
  s.runs = [
    { id: uid(), name: 'Run 1', type: 'double', gender: 'any', days: all.slice() },
    { id: uid(), name: 'Run 2', type: 'double', gender: 'F', days: all.slice() },
    { id: uid(), name: 'Run 3', type: 'double', gender: 'any', days: all.slice() },
    { id: uid(), name: 'Run 4', type: 'single', gender: 'any', days: all.slice() },
    { id: uid(), name: 'Run 5', type: 'single', gender: 'F', days: all.slice() },
    { id: uid(), name: 'Run 6', type: 'single', gender: 'any', days: all.slice(), needsDriver: false, allowed: named },
  ];
  Object.assign(s.carers.find(c => c.name === 'Isla Reed'), { preferredRuns: [s.runs[3].id], onlyPreferred: true });
  return s;
}

// ---------- Events ----------
document.getElementById('tabs').addEventListener('click', e => {
  const t = e.target.closest('button[data-tab]');
  if (t) { ui.tab = t.dataset.tab; render(); }
});

document.getElementById('app').addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b || b.tagName === 'SELECT' || b.tagName === 'INPUT') return;
  const a = b.dataset.action;
  const week = getWeek(state, ui.week);
  switch (a) {
    case 'prevWeek': ui.week = addDays(ui.week, -7); ui.report = null; break;
    case 'nextWeek': ui.week = addDays(ui.week, 7); ui.report = null; break;
    case 'planWeeks': {
      const n = Number(document.getElementById('planCount').value) || 4;
      ui.planCount = n;
      if (!confirm(`Auto-fill ${n} weeks from ${fmtDate(ui.week)}? Unlocked slots in those weeks are re-planned; finalised weeks are skipped.`)) return;
      const res = autoFillWeeks(state, ui.week, n);
      ui.report = `Planned ${res.filter(r => !r.finalised).length} week(s):\n` + res.map(r => `• w/c ${fmtDate(r.week)}: ` +
        (r.finalised ? 'finalised – left as it is' : r.problems ? `${r.problems} problem(s) to look at` : 'all runs covered')).join('\n') +
        '\n\nUse ▶ to look through them.';
      break;
    }
    case 'fillGaps': {
      const r = fillGaps(state, ui.week);
      const errs = r.issues.list.filter(i => i.level === 'error');
      ui.report = r.log.join('\n') + (errs.length ? `\n\nStill needs attention (${errs.length}):\n` + errs.slice(0, 30).map(i => '• ' + i.msg).join('\n') : '\n\nAll runs covered.');
      break;
    }
    case 'autofill': {
      const r = autoFill(state, ui.week);
      const errs = r.issues.list.filter(i => i.level === 'error');
      ui.report = r.log.join('\n') + (errs.length ? `\n\nStill needs attention (${errs.length}):\n` + errs.slice(0, 30).map(i => '• ' + i.msg).join('\n') + (errs.length > 30 ? '\n…' : '') : '\n\nAll runs covered.');
      break;
    }
    case 'finaliseWeek': {
      const errs = validate(state, ui.week).list.filter(i => i.level === 'error').length;
      if (errs && !confirm(`This week still has ${errs} problem(s). Finalise it anyway?`)) return;
      week.final = true; ui.report = null; break;
    }
    case 'reopenWeek':
      if (!confirm('Reopen this week? Auto-fill, clearing and editing will be switched back on.')) return;
      delete week.final; break;
    case 'clearUnlocked': if (week.final) return; clearUnlocked(state, ui.week); ui.report = null; break;
    case 'clearAll': if (week.final || !confirm('Clear every assignment this week, including locked ones?')) return;
      delete state.weeks[ui.week]; ui.report = null; break;
    case 'copyPrev': {
      if (week.final) return;
      const prev = state.weeks[addDays(ui.week, -7)];
      if (!prev) { alert('There is no schedule for the previous week.'); return; }
      if (!confirm('Replace this week with a copy of last week? Copied slots will be locked.')) return;
      const copy = JSON.parse(JSON.stringify(prev));
      for (const byDay of Object.values(copy.cells)) for (const cell of Object.values(byDay)) for (const s of cell.slots) if (s.c) s.locked = true;
      state.weeks[ui.week] = copy; ui.report = 'Copied previous week. Check the highlighted cells for leave/sickness this week.';
      break;
    }
    case 'lock': { if (week.final) return; const s = getCell(week, runById(b.dataset.run), Number(b.dataset.day)).slots[Number(b.dataset.slot)]; s.locked = !s.locked; break; }
    case 'shadow': getCell(week, runById(b.dataset.run), Number(b.dataset.day)).shadowOpen = true; break;
    case 'findCover': {
      const x = { week: ui.week, runId: b.dataset.run, d: Number(b.dataset.day), idx: Number(b.dataset.slot) };
      if (!ui.cover.some(y => JSON.stringify(y) === JSON.stringify(x))) ui.cover.push(x);
      break;
    }
    case 'coverPick': {
      const x = ui.cover[Number(b.dataset.k)];
      getCell(state.weeks[x.week], runById(x.runId), x.d).slots[x.idx] = { c: b.dataset.c, locked: true, override: false };
      ui.cover.splice(Number(b.dataset.k), 1);
      ui.report = null;
      break;
    }
    case 'coverSkip': ui.cover.splice(Number(b.dataset.k), 1); break;
    case 'sickForm': {
      const today = todayIso();
      const from = today >= ui.week && today <= addDays(ui.week, 6) ? today : ui.week;
      ui.sickForm = { carer: '', from, to: from };
      break;
    }
    case 'sickCancel': ui.sickForm = null; break;
    case 'sickSave': {
      const f = document.getElementById('sickForm');
      const carerId = f.querySelector('[data-f="sickCarer"]').value;
      const from = f.querySelector('[data-f="sickFrom"]').value;
      const to = f.querySelector('[data-f="sickTo"]').value || from;
      if (!carerId || !from) { alert('Choose the carer and the first day they are off sick.'); return; }
      const emptied = reportSickness(state, carerId, from, to);
      ui.sickForm = null;
      ui.cover = ui.cover.concat(emptied);
      ui.report = `${byId(carerId).name} marked off sick ${fmtDate(from)}${to > from ? ' to ' + fmtDate(to) : ''}: taken off ${emptied.length} shift(s).` +
        (emptied.length ? ' Choose cover below.' : ' They had no shifts in those dates.');
      break;
    }
    case 'share': {
      const what = b.dataset.what;
      if (what === 'csv') { exportCsv(); render(); return; }
      ui.printWhat = what;
      render(); // lays out what is printed – an update needs this before the changes are marked as shared
      // remember what carers were sent, so later changes can be listed
      if (/^(pdf-|carers$|sheets$)/.test(what)) {
        markShared(state, ui.week); save();
        const printed = document.getElementById('print-area').innerHTML;
        render();
        document.getElementById('print-area').innerHTML = printed;
      }
      setPageSize(/^(runs|carers|pdf-team)$/.test(what));
      if (/^pdf-/.test(what)) {
        const name = `Rota ${{ 'pdf-team': 'team', 'pdf-sheets': 'carers', 'pdf-update': 'update' }[what]} w-c ${ui.week}`;
        if (desktop && desktop.savePdf) {
          desktop.savePdf({ name: name + '.pdf', landscape: what === 'pdf-team' })
            .then(r => { if (r.saved) alert(`PDF saved:\n${r.file}\n\nReady to send to carers by email or WhatsApp.`); })
            .catch(err => alert('Could not save the PDF: ' + err.message));
        } else {
          // in a browser: the print window opens – choose "Save as PDF" as the printer
          const title = document.title;
          document.title = name;
          window.print();
          document.title = title;
        }
      } else {
        window.print();
      }
      return;
    }

    case 'carerView': ui.carerView = b.dataset.id; render(); return;
    case 'carerViewClose': ui.carerView = null; render(); return;
    case 'swapForm': ui.swapForm = { a: '', dA: '', b: '', dB: '' }; render(); return;
    case 'swapCancel': ui.swapForm = null; render(); return;
    case 'swapCheck': {
      const f = readSwapForm();
      if (!f.a || f.dA === '' || !f.b) { alert('Choose both carers and the shift to swap.'); return; }
      f.check = planSwap(state, ui.week, f.a, Number(f.dA), f.b, f.dB === '' ? null : Number(f.dB));
      render(); return;
    }
    case 'swapApply': {
      const f = ui.swapForm;
      f.check.apply(state);
      ui.report = 'Swapped: ' + f.check.text + (f.check.problems.length ? `\n(Note: ${f.check.problems.join('; ')})` : '');
      ui.swapForm = null;
      break;
    }
    case 'newCarer': ui.editCarer = blankCarer(); break;
    case 'newAgency': ui.editCarer = blankCarer(true); break;
    case 'editCarer': ui.editCarer = JSON.parse(JSON.stringify(byId(b.dataset.id))); break;
    case 'cancelCarer': ui.editCarer = null; break;
    case 'addLeave': readCarerForm(); ui.editCarer.leave.push({ type: 'AL', from: todayIso(), to: todayIso() }); render(); return;
    case 'delLeave': readCarerForm(); ui.editCarer.leave.splice(Number(b.dataset.i), 1); render(); return;
    case 'saveCarer': {
      readCarerForm();
      if (!ui.editCarer.name) { alert('Please enter a name.'); return; }
      const i = state.carers.findIndex(c => c.id === ui.editCarer.id);
      if (i >= 0) state.carers[i] = ui.editCarer; else state.carers.push(ui.editCarer);
      for (const o of state.carers) { // "can't work with" applies both ways, so keep the other carers' lists in step
        if (o.id === ui.editCarer.id) continue;
        const set = new Set(o.notWith || []);
        if (ui.editCarer.notWith.includes(o.id)) set.add(ui.editCarer.id); else set.delete(ui.editCarer.id);
        o.notWith = [...set];
      }
      ui.editCarer = null; break;
    }
    case 'delCarer': {
      const c = byId(b.dataset.id);
      if (!confirm(`Remove ${c.name}? They will be taken off all schedules. (Tip: untick "Active" instead to keep their history.)`)) return;
      state.carers = state.carers.filter(x => x.id !== c.id);
      for (const r of state.runs) if (r.allowed) r.allowed = r.allowed.filter(id => id !== c.id);
      for (const o of state.carers) if (o.notWith) o.notWith = o.notWith.filter(id => id !== c.id);
      for (const w of Object.values(state.weeks)) for (const byDay of Object.values(w.cells)) for (const cell of Object.values(byDay)) {
        for (const s of cell.slots) if (s.c === c.id) { s.c = null; s.locked = false; }
        if (cell.shadow && cell.shadow.c === c.id) cell.shadow.c = null;
      }
      break;
    }

    case 'newRun': state.runs.push({ id: uid(), name: `Run ${state.runs.length + 1}`, type: 'double', gender: 'any', days: DAYS.map(() => true), needsDriver: true, allowed: [] }); break;
    case 'delRun': {
      const r = runById(b.dataset.id);
      if (!confirm(`Remove ${r.name}? Its assignments will be deleted.`)) return;
      state.runs = state.runs.filter(x => x.id !== r.id);
      for (const w of Object.values(state.weeks)) delete w.cells[r.id];
      for (const c of state.carers) if (c.preferredRuns) c.preferredRuns = c.preferredRuns.filter(id => id !== r.id);
      break;
    }
    case 'runUp': case 'runDown': {
      const i = Number(b.dataset.i), j = a === 'runUp' ? i - 1 : i + 1;
      [state.runs[i], state.runs[j]] = [state.runs[j], state.runs[i]];
      break;
    }

    case 'openDataFolder': desktop.openFolder(); return;
    case 'chooseFolder':
      desktop.chooseFolder().then(r => {
        if (!r.changed) return;
        deskInfo = r.info;
        reloadFromDisk();
        alert(`CareSchedule data is now kept in:\n${deskInfo.folder}` + (deskInfo.mode === 'view' ? `\n\n${holderText()} has it open, so this computer is view only for now.` : ''));
      });
      return;
    case 'retryLock':
      deskInfo = desktop.retryLock();
      if (deskInfo.mode === 'edit') reloadFromDisk(); else alert(`${holderText()} still has CareSchedule open.`);
      return;
    case 'leaveCheck': {
      const f = readLeaveForm();
      if (!f.carer || !f.from) { alert('Choose the carer and the first day of leave.'); return; }
      ui.leaveCheck = leaveImpact(state, f.carer, f.from, f.to, f.type);
      render(); return;
    }
    case 'leaveAdd': {
      const f = ui.leaveForm, c = byId(f.carer);
      c.leave = (c.leave || []).concat([{ type: f.type, from: f.from, to: f.to }]);
      alert(`${LEAVE_TYPES[f.type]} added for ${c.name}: ${fmtDate(f.from)}${f.to > f.from ? ' to ' + fmtDate(f.to) : ''}.\n\nAny shifts they already have in those dates will show as problems on the Schedule – use Find cover there.`);
      ui.leaveForm = null; ui.leaveCheck = null;
      break;
    }
    case 'leaveCancel': ui.leaveCheck = null; render(); return;
    case 'reportExcel': downloadReport(); return;
    case 'carerTemplate': downloadCarerTemplate(); return;
    case 'carerExport': downloadCarers(); return;
    case 'importApply': {
      const { plan } = ui.importPlan;
      applyCarerImport(state, plan);
      alert(`Imported: ${plan.add.length} new carer(s), ${plan.update.length} updated.`);
      ui.importPlan = null;
      break;
    }
    case 'importCancel': ui.importPlan = null; break;
    case 'backup': download(`careschedule-backup-${todayIso()}.json`, JSON.stringify(state, null, 2), 'application/json'); return;
    case 'sample': if (state.carers.length && !confirm('Replace all current data with sample data?')) return;
      state = sampleData(); dataProblem = null; ui.tab = 'schedule'; break;
    case 'reset': if (!confirm('Delete ALL carers, runs and schedules? Export a backup first if unsure.')) return;
      state = newState(); dataProblem = null; break;
    default: return;
  }
  save(); render();
});

document.getElementById('app').addEventListener('change', e => {
  const t = e.target;
  const a = t.dataset.action;
  if (a === 'assign') {
    assign(t.dataset.run, Number(t.dataset.day), t.dataset.slot, t.value);
    ui.report = null;
  } else if (a === 'runField') {
    const r = runById(t.dataset.id);
    r[t.dataset.f] = t.dataset.f === 'name' ? (t.value.trim() || r.name) : t.value;
  } else if (a === 'runFlag') {
    runById(t.dataset.id)[t.dataset.f] = t.checked;
  } else if (a === 'runAllowed') {
    const r = runById(t.dataset.id);
    const set = new Set(r.allowed || []);
    if (t.checked) set.add(t.dataset.c); else set.delete(t.dataset.c);
    r.allowed = [...set];
    ui.openAllowed = r.id;
  } else if (a === 'runDay') {
    runById(t.dataset.id).days[Number(t.dataset.i)] = t.checked;
  } else if (t.id === 'weekPick') {
    if (!t.value) return;
    ui.week = mondayOf(t.value); ui.report = null;
  } else if (t.id === 'secondPass' || t.id === 'secondPassSetting') {
    state.settings.secondPass = t.checked;
  } else if (t.id === 'maxInARow') {
    state.settings.maxInARow = Math.max(0, Math.min(13, Number(t.value) || 0));
  } else if (t.id === 'weekendRule') {
    state.settings.weekendRule = t.checked;
  } else if (t.id === 'orgName') {
    state.settings.orgName = t.value.trim();
  } else if (t.id === 'useAgency') {
    state.settings.useAgency = t.checked;
  } else if (t.id === 'useOvertime') {
    state.settings.useOvertime = t.checked;
  } else if (t.id === 'genderPriority') {
    state.settings.genderPriority = t.value;
  } else if (t.id === 'findCarer') {
    const c = state.carers.find(x => x.name.toLowerCase() === t.value.trim().toLowerCase());
    ui.find = c ? c.id : null;
    if (c) ui.carerView = c.id;
    render(); return;
  } else if (t.id === 'carerViewWeeks') {
    ui.carerViewWeeks = Number(t.value); render(); return;
  } else if (/^sw/.test(t.dataset.f || '') && ui.swapForm) {
    readSwapForm(); ui.swapForm.check = null; render(); return;
  } else if (t.id === 'leaveWeeks') {
    ui.leaveWeeks = Number(t.value); render(); return;
  } else if (t.id === 'reportWeeks') {
    ui.reportWeeks = Number(t.value); render(); return;
  } else if (t.id === 'importCarers') {
    const file = t.files[0];
    if (!file) return;
    readCarerFile(file).then(rows => {
      ui.importPlan = { fileName: file.name, plan: planCarerImport(state, rows) };
      render();
    }).catch(err => alert('Could not read that file: ' + err.message));
    return;
  } else if (t.id === 'importFile') {
    const file = t.files[0];
    if (!file) return;
    file.text().then(txt => {
      try {
        const data = JSON.parse(txt);
        if (!Array.isArray(data.carers) || !Array.isArray(data.runs)) throw new Error('Not a CareSchedule backup');
        if (!confirm('Replace all current data with this backup?')) return;
        state = withDefaults(data);
        dataProblem = null;
        save(); render(); alert('Backup imported.');
      } catch (err) { alert('Could not import: ' + err.message); }
    });
    return;
  } else {
    return;
  }
  save(); render();
});

render();
if (desktop && desktop.info().notice) alert(desktop.info().notice);
if (dataProblem) {
  alert(`Your saved data could not be read (${dataProblem}).\n\nNothing will be saved until you restore it: go to Settings & Data → Import backup` +
    (desktop ? ' and choose the latest file in the backups folder (Open data folder).' : '.'));
}
</script>
</body>
