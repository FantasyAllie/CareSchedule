      const result = desktop.save(json);
      if (result !== true) throw new Error(result);
    } else {
      localStorage.setItem(STORE_KEY, json);
    }
    saveFailed = false;
  } catch (e) {
    if (!saveFailed) alert(desktop ? `Could not save your data file: ${e.message}` : 'Could not save to browser storage. Please use "Export backup" to keep your data.');
    saveFailed = true;
  }
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
const byId = id => state.carers.find(c => c.id === id);
const runById = id => state.runs.find(r => r.id === id);
const sortedCarers = () => state.carers.slice().sort((a, b) => a.name.localeCompare(b.name));
function fmtDate(iso) { const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; }
function genderLabel(g) { return g === 'M' ? 'Male only' : g === 'F' ? 'Female only' : 'Male or female'; }

function undo() {
  if (!undoStack.length || dataProblem) return;
  state = withDefaults(JSON.parse(undoStack.pop()));
  ui.editCarer = null; ui.importPlan = null; ui.sickForm = null; ui.report = 'Undone the last change.';
  save(true);
  render();
}
document.getElementById('undoBtn').addEventListener('click', undo);
// close the Share menu when clicking anywhere else
document.addEventListener('click', e => {
  for (const d of document.querySelectorAll('details.share[open]')) if (!d.contains(e.target)) d.removeAttribute('open');
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) {
    e.preventDefault();
    undo();
  }
});

// Data changed on another computer (we're view-only), or the editing lock changed hands.
function reloadFromDisk() {
  state = load();
  lastSaved = stateJson(state);
  undoStack.length = 0;
  render();
}
if (desktop) {
  desktop.onChanged(reloadFromDisk);
  desktop.onLockChanged(i => {
    const wasView = deskInfo.mode === 'view';
    deskInfo = i;
    if (wasView && i.mode === 'edit') reloadFromDisk(); else render();
    if (!wasView && i.mode === 'view') alert(`${holderText()} is now editing CareSchedule, so this computer has switched to view only.`);
  });
  desktop.onConflict(name => alert(`Another computer saved CareSchedule data while you were editing (usually both opened it at the same moment).\n\nYour version has been kept. Theirs was saved in the data folder as ${name} – check it if they made changes.`));
}

function viewOnlyBanner() {
  if (!deskInfo || deskInfo.mode !== 'view') return '';
  const since = deskInfo.holder ? new Date(deskInfo.holder.since).toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  return `<div class="viewonly">👁 <b>View only</b> – ${esc(holderText())} has CareSchedule open${since ? ` (since ${esc(since)})` : ''}, so only one computer can make changes.
    This screen updates when they save. <button class="btn" data-action="retryLock">Try again</button></div>`;
}

function render() {
  document.getElementById('undoBtn').disabled = !undoStack.length;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === ui.tab));
  const app = document.getElementById('app');
  app.innerHTML = viewOnlyBanner() + { schedule: viewSchedule, carers: viewCarers, runs: viewRuns, leave: viewLeave, reports: viewReports, settings: viewSettings }[ui.tab]();
}

// ---------- Schedule ----------
function viewSchedule() {
  if (!state.runs.length || !state.carers.length) {
    return `<div class="panel">Add some <b>carers</b> and <b>runs</b> first, or load the sample data from <b>Settings &amp; Data</b>.</div>`;
  }
  const week = getWeek(state, ui.week);
  const final = !!week.final;
  const off = final ? 'disabled title="This week is finalised – reopen it to change it"' : '';
  const v = validate(state, ui.week);
  const head = DAYS.map((d, i) => `<th>${d}<br><span class="muted">${fmtDate(addDays(ui.week, i)).slice(0, 5)}</span></th>`).join('');
  const rows = state.runs.map(run => {
    const tds = DAYS.map((_, d) => {
      if (!run.days[d]) return `<td class="cell off">Not running</td>`;
      const cell = getCell(week, run, d);
      const iss = v.cells[run.id + '|' + d] || [];
      const cls = iss.some(i => i.level === 'error') ? 'err' : iss.length ? 'warn' : '';
      const slots = cell.slots.map((s, i) => `
        <div class="slot ${s.locked ? 'locked' : ''} ${ui.find && s.c === ui.find ? 'found' : ''}">
          ${carerSelect(run, d, s.c, `data-slot="${i}" ${off}`)}
          <button class="lockbtn" ${off} title="${s.locked ? 'Locked – auto-fill keeps this' : 'Unlocked – auto-fill may change this'}" data-action="lock" data-run="${run.id}" data-day="${d}" data-slot="${i}">${s.locked ? '🔒' : '🔓'}</button>
        </div>`).join('');
      const shadow = (cell.shadow.c || cell.shadowOpen)
        ? `<div class="slot shadow ${ui.find && cell.shadow.c === ui.find ? 'found' : ''}">${carerSelect(run, d, cell.shadow.c, `data-slot="shadow" ${off}`, 'Shadow / training')}</div>`
        : final ? '' : `<button class="linkbtn" data-action="shadow" data-run="${run.id}" data-day="${d}">+ Shadow Carer</button>`;
      const issues = iss.map(i => `<div class="${i.level === 'error' ? 'e' : 'w'}">${esc(i.msg)}</div>`).join('');
      const findCover = cell.slots.map((sl, i) => sl.c ? '' : `<button class="linkbtn cover" data-action="findCover" data-run="${run.id}" data-day="${d}" data-slot="${i}">Find cover</button>`).find(Boolean) || '';
      return `<td class="cell ${cls}">${slots}${findCover}${shadow}<div class="issues">${issues}</div></td>`;
    }).join('');
    return `<tr><th>${esc(run.name)}<br><span class="tag">${run.type === 'double' ? 'Double up' : 'Single'}</span><span class="tag">${run.gender === 'any' ? 'M/F' : run.gender === 'M' ? 'Male' : 'Female'}</span>${isSpecific(run) ? `<span class="tag" title="${esc(run.allowed.map(id => (byId(id) || {}).name).join(', '))}">${run.allowed.length} named carers</span>` : ''}${needsDriver(run) ? '' : '<span class="tag nodrv">No driver needed</span>'}</th>${tds}</tr>`;
  }).join('');

  const summaryRow = c => {
    const s = v.carers[c.id];
    const cls = s.count > capacity(c, true) ? 'over' : s.count === s.contracted ? 'met' : 'under';
    const days = DAYS.map((_, d) => {
      const st = carerStatus(c, ui.week, d);
      if (s.days[d]) {
        const where = state.runs.filter(r => r.days[d] && cellIds(getCell(week, r, d)).includes(c.id)).map(r => r.name).join(', ');
        return `<td>${esc(where)}</td>`;
      }
      return `<td class="muted">${st.ok ? 'free' : esc(st.label)}</td>`;
    }).join('');
    const h = s.history;
    const known = h.weekends.filter(x => x !== null);
    const weekendsOff = known.filter(x => !x).length;
    const runName = id => esc((runById(id) || { name: '?' }).name);
    const pair = s.rotation.runs.length
      ? `Runs: ${s.rotation.runs.map(runName).join(' + ')} – ${s.rotation.streak >= ROTATION_WEEKS ? 'due to swap' : `week ${s.rotation.streak + 1} of ${ROTATION_WEEKS}`}`
      : '';
    const past = c.agency ? '<span class="muted">agency – only used to fill gaps</span>' : known.length
      ? `${weekendsOff} of ${known.length} weekends off · ${weekendBadge(s.weekendStreak)}<br><span class="muted">${pair}</span>`
      : '<span class="muted">no history yet</span>';
    return `<tr><td><button class="linkbtn name" data-action="carerView" data-id="${c.id}" title="See ${esc(c.name)}'s next few weeks">${esc(c.name)}</button> <span class="tag ${c.gender}">${c.gender}</span><span class="tag ${c.driver ? 'drv' : 'nodrv'}">${c.driver ? 'Driver' : 'Non-driver'}</span>${c.agency ? '<span class="tag agency">Agency</span>' : ''}${traineeTag(c)}${!c.agency && s.weekendStreak >= 2 ? '<span class="tag flag">⚑ Weekend off priority</span>' : ''}</td>
      <td class="${c.agency ? '' : cls}">${c.agency ? `${s.count} (max ${s.contracted})` : `${s.count} / ${s.contracted}${c.overtime ? ' (+1 OT)' : ''}`}</td>${days}<td>${past}</td></tr>`;
  };
  const activeCarers = sortedCarers().filter(c => c.active !== false);
  const agencyRows = activeCarers.filter(c => c.agency).map(summaryRow).join('');
  const summary = activeCarers.filter(c => !c.agency).map(summaryRow).join('') +
    (agencyRows ? `<tr><th colspan="${DAYS.length + 3}">Agency staff</th></tr>${agencyRows}` : '');

  const errs = v.list.filter(i => i.level === 'error').length;
  const warns = v.list.length - errs;
  return `
  <div class="panel">
    <div class="toolbar">
      <button class="btn" data-action="prevWeek">◀</button>
      <label>Week commencing <input type="date" id="weekPick" value="${ui.week}"></label>
      <button class="btn" data-action="nextWeek">▶</button>
      <span style="flex:1"></span>
      <label><input type="checkbox" id="secondPass" ${state.settings.secondPass ? 'checked' : ''}> Double pass</label>
      <button class="btn primary" data-action="autofill" ${off}>Auto-fill week</button>
      <span class="multi"><button class="btn" data-action="planWeeks" title="Auto-fill this week and the ones after it, in date order (finalised weeks are skipped)">Auto-fill</button>
        <select id="planCount">${[2, 4, 6, 8].map(n => `<option value="${n}" ${ui.planCount === n ? 'selected' : ''}>${n} weeks</option>`).join('')}</select></span>
      <button class="btn" data-action="fillGaps" ${off || 'title="Only fill empty slots – nobody already on the schedule is moved"'}>Fill gaps only</button>
      <button class="btn" data-action="sickForm">🤒 Report sickness</button>
      <button class="btn" data-action="swapForm" title="Swap shifts between two carers, or give a shift to someone else">⇄ Swap</button>
      <input id="findCarer" list="carerNames" placeholder="🔍 Find carer" value="${esc(ui.find ? (byId(ui.find) || {}).name || '' : '')}" size="14">
      <datalist id="carerNames">${sortedCarers().filter(c => c.active !== false).map(c => `<option value="${esc(c.name)}">`).join('')}</datalist>
      <button class="btn" data-action="clearUnlocked" ${off}>Clear unlocked</button>
      <button class="btn danger" data-action="clearAll" ${off}>Clear all</button>
      <button class="btn" data-action="copyPrev" ${off}>Copy previous week</button>
      <button class="btn ${final ? '' : 'final'}" data-action="${final ? 'reopenWeek' : 'finaliseWeek'}">${final ? 'Reopen week' : '✔ Finalise week'}</button>
      <details class="share"><summary class="btn primary">Share ▾</summary>
        <div class="sharemenu">
          <div class="smhead">For carers (PDF)</div>
          <button data-action="share" data-what="pdf-team">📄 Team rota</button>
          <button data-action="share" data-what="pdf-sheets">📄 One page per carer</button>
          ${(changesSinceShared(state, ui.week) || []).length ? '<button data-action="share" data-what="pdf-update">📄 Update for carers whose shifts changed</button>' : ''}
          <div class="smhead">Print</div>
          <button data-action="share" data-what="runs">🖨 Run rota</button>
          <button data-action="share" data-what="carers">🖨 Carer rota (for the wall)</button>
          <button data-action="share" data-what="sheets">🖨 A sheet for each carer</button>
          <div class="smhead">Spreadsheet</div>
          <button data-action="share" data-what="csv">⬇ Export CSV</button>
        </div>
      </details>
    </div>
    ${final ? `<div class="finalbar">✔ <b>This week is finalised.</b> Auto-fill, Fill gaps only, clearing and editing are switched off so it can't be changed by accident.
      Sickness cover (Report sickness / Find cover) still works. Use <b>Reopen week</b> to make other changes.</div>` : ''}
    <div class="legend">Choosing a carer by hand locks the slot (🔒) so auto-fill won't change it. Click the lock to unlock.
      <b>Fill gaps only</b> fills empty slots without moving anyone.
      Auto-fill is shuffled each time, so press it again for a different version.
      ${errs ? `<b class="over">${errs} problem(s)</b>` : '<b class="met">No problems</b>'}${warns ? `, <b class="under">${warns} warning(s)</b>` : ''}</div>
    ${changesBanner()}
    ${ui.carerView ? carerViewPanel() : ''}
    ${ui.swapForm ? swapFormView() : ''}
    ${ui.sickForm ? sickFormView() : ''}
    ${coverPanel()}
    ${ui.report ? `<div class="report panel" style="margin-top:8px">${esc(ui.report)}</div>` : ''}
    <div class="grid-wrap"><table class="grid"><colgroup><col class="runcol">${DAYS.map(() => '<col>').join('')}</colgroup><thead><tr><th>Run</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
  </div>
  <div class="panel">
    <h3 style="margin-top:0">Carer summary – days booked / contracted</h3>
    <div class="grid-wrap"><table><thead><tr><th>Carer</th><th>Days</th>${DAYS.map(d => `<th>${d}</th>`).join('')}<th>Previous ${HISTORY_WEEKS} weeks</th></tr></thead><tbody>${summary}</tbody></table></div>
  </div>
  <div id="print-area">${printView(ui.printWhat)}</div>`;
}

// Shown when the week has changed since it was last shared with carers.
function changesBanner() {
  const ch = changesSinceShared(state, ui.week);
  const when = getWeek(state, ui.week).shared;
  if (!ch) return '';
  const at = new Date(when.at).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  if (!ch.length) return `<div class="sharedbar">✔ Shared with carers ${esc(at)} – no changes since.</div>`;
  const people = [...new Set(ch.map(x => x.carer.id))];
  const list = ch.map(x => `<li><b>${esc(x.carer.name)}</b> – ${DAYS[x.d]} ${esc(longDate(addDays(ui.week, x.d), { day: 'numeric', month: 'short' }))}: now <b>${esc(x.now)}</b> (was ${esc(x.was)})</li>`).join('');
  return `<div class="changedbar">⚠ <b>Changed since you shared this rota</b> (${esc(at)}): ${ch.length} change(s) for ${people.length} carer(s).
    <button class="btn" data-action="share" data-what="pdf-update">📄 Share update</button>
    <details ${ui.showChanges ? 'open' : ''}><summary>See changes</summary><ul class="why">${list}</ul></details></div>`;
}

// One carer's next few weeks, opened from the summary or Find carer.
function carerViewPanel() {
  const c = byId(ui.carerView);
  if (!c) return '';
  const n = ui.carerViewWeeks || 6;
  const rows = Array.from({ length: n }, (_, k) => addDays(ui.week, 7 * k)).map(ws => {
    const week = state.weeks[ws];
    const cells = DAYS.map((_, d) => {
      const date = addDays(ws, d);
      let spot = null;
      if (week) for (const r of state.runs) {
        const cell = r.days[d] && week.cells[r.id] && week.cells[r.id][d];
        if (!cell) continue;
        if (cell.slots.some(sl => sl.c === c.id)) spot = r.name;
        else if (cell.shadow && cell.shadow.c === c.id) spot = r.name + ' (shadow)';
      }
      const l = leaveOn(c, date), rq = requestOn(c, date);
      if (spot) return `<td>${runPill(spot.replace(' (shadow)', ''), / \(shadow\)/.test(spot))}${rq ? ' <span class="under" title="Asked for this day off">R</span>' : ''}</td>`;
      if (l) return `<td class="lv ${l.type === 'SICK' ? 'sk' : 'al'}">${l.type === 'SICK' ? 'Sick' : 'AL'}</td>`;
      if (rq) return '<td class="lv rq">Request</td>';
      return `<td class="muted">${week ? 'Off' : ''}</td>`;
    }).join('');
    const count = week ? DAYS.filter((_, d) => state.runs.some(r => { const cell = r.days[d] && week.cells[r.id] && week.cells[r.id][d]; return cell && (cell.slots.some(sl => sl.c === c.id) || (cell.shadow && cell.shadow.c === c.id)); })).length : null;
    return `<tr><th>w/c ${fmtDate(ws).slice(0, 5)}</th>${cells}<td>${count == null ? '<span class="muted">not planned yet</span>' : count + ' day(s)'}</td></tr>`;
  }).join('');
  return `<div class="panel cover carerview" style="margin-top:8px">
    <div class="toolbar"><h3 style="margin:0;flex:1">${esc(c.name)} – next ${n} weeks</h3>
      <label>Show <select id="carerViewWeeks">${[4, 6, 8].map(k => `<option value="${k}" ${n === k ? 'selected' : ''}>${k} weeks</option>`).join('')}</select></label>
      <button class="btn" data-action="carerViewClose">Close</button></div>
    <table class="pubtable"><thead><tr><th>Week</th>${DAYS.map(d => `<th>${d}</th>`).join('')}<th>Days</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="muted" style="margin-top:4px">Days per week: ${c.daysPerWeek}${hasPattern(c) ? ` · usually works ${DAYS.filter((_, i) => c.pattern.days[i]).join(' ')}${Number(c.pattern.every) === 2 ? ' every other week' : ''}` : ''}</div>
  </div>`;
}

function swapFormView() {
  const f = ui.swapForm, week = getWeek(state, ui.week);
  const working = id => DAYS.map((_, d) => spotOf(state, ui.week, id, d)).map((sp, d) => sp ? { d, run: sp.run.name + (sp.idx === 'shadow' ? ' (shadow)' : '') } : null).filter(Boolean);
  const people = sortedCarers().filter(c => c.active !== false);
  const dayOpts = (id, sel, extra) => (extra || '') + working(id).map(x => `<option value="${x.d}" ${String(sel) === String(x.d) ? 'selected' : ''}>${DAYS[x.d]} ${fmtDate(addDays(ui.week, x.d)).slice(0, 5)} – ${esc(x.run)}</option>`).join('');
  const plan = f.check;
  return `<div class="panel cover" id="swapForm" style="margin-top:8px">
    <h3 style="margin-top:0">Swap shifts</h3>
    <div class="row">
      <label>Carer <select data-f="swA"><option value="">Choose…</option>${people.filter(c => working(c.id).length).map(c => `<option value="${c.id}" ${c.id === f.a ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
      <label>their shift <select data-f="swDA">${f.a ? dayOpts(f.a, f.dA) : '<option value="">–</option>'}</select></label>
      <span>⇄</span>
      <label>with <select data-f="swB"><option value="">Choose…</option>${people.filter(c => c.id !== f.a).map(c => `<option value="${c.id}" ${c.id === f.b ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
      <label>who gives <select data-f="swDB">${f.b ? dayOpts(f.b, f.dB, `<option value="" ${f.dB === '' || f.dB == null ? 'selected' : ''}>nothing – just takes the shift</option>`) : '<option value="">–</option>'}</select></label>
      <button class="btn primary" data-action="swapCheck">Check swap</button>
      <button class="btn" data-action="swapCancel">Cancel</button>
    </div>
    <div class="muted">Pick the same day for both to swap runs that day. Every rule is checked for both carers before anything changes.</div>
    ${plan ? plan.error ? `<p class="over">${esc(plan.error)}</p>` : `
      <p>${esc(plan.text)}</p>
      ${plan.problems.length ? `<p class="over">⚠ This would break a rule:</p><ul class="why e">${plan.problems.map(m => `<li>${esc(m)}</li>`).join('')}</ul>` : '<p class="met">✔ No rule problems.</p>'}
      <div class="toolbar"><button class="btn primary" data-action="swapApply">${plan.problems.length ? 'Swap anyway' : 'Swap'}</button></div>` : ''}
  </div>`;
}

function readSwapForm() {
  const f = document.getElementById('swapForm');
  const v = k => f.querySelector(`[data-f="${k}"]`).value;
  const prev = ui.swapForm;
  ui.swapForm = { a: v('swA'), dA: v('swDA'), b: v('swB'), dB: v('swDB') };
  if (prev.a !== ui.swapForm.a) ui.swapForm.dA = '';
  if (prev.b !== ui.swapForm.b) ui.swapForm.dB = '';
  return ui.swapForm;
}

// Pages for just the carers whose shifts changed since the rota was shared, changed days marked.
function publishUpdate() {
  const ch = changesSinceShared(state, ui.week) || [];
  const ids = [...new Set(ch.map(x => x.carer.id))];
  return ids.map(id => {
    const c = byId(id), wk = carerWeek(c), changed = new Set(ch.filter(x => x.carer.id === id).map(x => x.d));
    return `<section class="pub sheet">
      ${pubHeader(c.name, `Updated rota · ${weekTitle()}`)}
      <div class="changenote">Your rota for this week has changed. Changed days are marked <span class="chg">Changed</span>.</div>
      <div class="days">${wk.map((x, d) => `<div class="day ${x ? '' : 'off'} ${changed.has(d) ? 'changed' : ''}">
        <div class="dname">${esc(longDate(addDays(ui.week, d), { weekday: 'long' }))}<span>${esc(longDate(addDays(ui.week, d), { day: 'numeric', month: 'long' }))}</span></div>
        <div class="dbody">${x ? `${runPill(x.run, x.shadow)}${x.with.length ? `<div class="with">Working with ${esc(x.with.join(', '))}</div>` : ''}` : '<span class="offtext">Day off</span>'}
          ${changed.has(d) ? `<span class="chg">Changed</span><div class="was">was: ${esc(ch.find(y => y.carer.id === id && y.d === d).was.replace(/Day off/, 'day off'))}</div>` : ''}</div>
      </div>`).join('')}</div>
      ${pubFooter()}
    </section>`;
  }).join('') || '<p>No changes since this rota was shared.</p>';
}

function sickFormView() {
  const f = ui.sickForm;
  return `<div class="panel sick" id="sickForm" style="margin-top:8px">
    <h3 style="margin-top:0">Report sickness</h3>
    <div class="row">
      <label>Carer <select data-f="sickCarer"><option value="">Choose…</option>${sortedCarers().filter(c => c.active !== false)
        .map(c => `<option value="${c.id}" ${c.id === f.carer ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
      <label>Off sick from <input type="date" data-f="sickFrom" value="${f.from}"></label>
      <label>to <input type="date" data-f="sickTo" value="${f.to}"></label>
      <button class="btn primary" data-action="sickSave">Mark sick &amp; find cover</button>
      <button class="btn" data-action="sickCancel">Cancel</button>
    </div>
    <div class="muted">They are taken off every shift in those dates (locked ones too) and you get cover suggestions for each one.</div>
  </div>`;
}

// Suggested cover for each slot in ui.cover that is still empty.
function coverPanel() {
  ui.cover = ui.cover.filter(x => {
    const run = runById(x.runId);
    const sl = run && state.weeks[x.week] && run.days[x.d] && getCell(state.weeks[x.week], run, x.d).slots[x.idx];
    return sl && !sl.c;
  });
  if (!ui.cover.length) return '';
  const items = ui.cover.map((x, k) => {
    const run = runById(x.runId);
    const { ok, no } = suggestCover(state, x.week, x.runId, x.d, x.idx);
    const picks = ok.slice(0, 6).map(o => `<button class="btn pick" data-action="coverPick" data-k="${k}" data-c="${o.carer.id}">
        <b>${esc(o.carer.name)}</b>${o.notes.length ? `<br><span class="muted">${esc(o.notes.join(' · '))}</span>` : ''}</button>`).join('');
    return `<div class="coveritem">
      <div><b>${esc(run.name)} – ${DAYS[x.d]} ${fmtDate(addDays(x.week, x.d))}</b>
        <button class="linkbtn" data-action="coverSkip" data-k="${k}">leave empty</button></div>
      <div class="picks">${picks || '<span class="over">No one can cover this without breaking a rule – see below, or use agency staff.</span>'}</div>
      ${no.length ? `<details><summary class="muted">Why others can't (${no.length})</summary><ul class="why">${no
        .map(n => `<li><b>${esc(n.carer.name)}</b> – ${esc(n.reason)}</li>`).join('')}</ul></details>` : ''}
    </div>`;
  }).join('');
  return `<div class="panel cover" style="margin-top:8px"><h3 style="margin-top:0">Cover needed (${ui.cover.length})</h3>
    <div class="muted" style="margin-bottom:6px">Best options first. Everyone listed can do it without breaking any rule. Click a name to put them on.</div>${items}</div>`;
}

function traineeTag(c) {
  return c.traineeUntil && c.traineeUntil >= ui.week ? ` <span class="tag trainee">Trainee until ${fmtDate(c.traineeUntil).slice(0, 5)}</span>` : '';
}

function weekendBadge(streak) {
  if (streak >= 2) return `<b class="over">⚑ worked last ${streak} weekends – priority to have this one off</b>`;
  if (streak === 1) return '<b class="under">worked last weekend – weekend off due</b>';
  return '<span class="met">had last weekend off</span>';
}

function cellIds(cell) { return cell.slots.map(s => s.c).concat(cell.shadow.c ? [cell.shadow.c] : []).filter(Boolean); }

function carerSelect(run, d, selected, attrs, placeholder) {
  const week = getWeek(state, ui.week);
  const bookedElsewhere = new Set();
  for (const r of state.runs) if (r.id !== run.id && r.days[d]) cellIds(getCell(week, r, d)).forEach(id => bookedElsewhere.add(id));
  const here = cellIds(getCell(week, run, d)).map(byId).filter(Boolean);
  const opts = sortedCarers().filter(c => c.active !== false || c.id === selected).map(c => {
    const notes = [];
    const clash = here.find(o => cantPair(c, o));
    if (clash) notes.push(`not with ${clash.name}`);
    const st = carerStatus(c, ui.week, d);
    if (!st.ok) notes.push(st.code === 'AL' ? 'AL' : st.code === 'SICK' ? 'Sick' : 'N/A');
    if (!genderOk(run, c)) notes.push('gender');
    if (!allowedOk(run, c)) notes.push('not on run list');
    if (!runTypeOk(run, c)) notes.push(c.runTypes === 'double' ? 'doubles only' : 'singles only');
    if (!preferredOk(run, c)) notes.push(`only ${preferredNames(c, state.runs)}`);
    else if (prefersRun(c, run)) notes.push('preferred');
    if (bookedElsewhere.has(c.id)) notes.push('booked');
    const label = `${c.name} (${c.gender}${c.driver ? ', D' : ''}${c.agency ? ', Agency' : ''})${notes.length ? ' – ' + notes.join(', ') : ''}`;
    return `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${esc(label)}</option>`;
  }).join('');
  const chosen = selected && byId(selected);
  const title = chosen ? `${chosen.name} (${chosen.gender === 'M' ? 'male' : 'female'}, ${chosen.driver ? 'driver' : 'non-driver'}${chosen.agency ? ', agency' : ''})` : '';
  return `<select data-action="assign" data-run="${run.id}" data-day="${d}" title="${esc(title)}" ${attrs}><option value="">${placeholder || '[OPEN]'}</option>${opts}</select>`;
}

// What to print: 'runs' (run × day), 'carers' (carer × day, for the wall) or 'sheets' (one page per carer).
function printView(what) {
  if (what === 'pdf-team') return publishTeam();
  if (what === 'pdf-update') return publishUpdate();
  if (what === 'pdf-sheets') return publishSheets();
  if (what === 'carers') return printCarerRota();
  if (what === 'sheets') return printCarerSheets();
  return printTable();
}

// Paper size for printing / PDF: landscape for the tables, portrait for one page per carer.
function setPageSize(landscape) {
  let el = document.getElementById('pageSize');
  if (!el) { el = document.createElement('style'); el.id = 'pageSize'; document.head.appendChild(el); }
  el.textContent = `@page { size: A4 ${landscape ? 'landscape' : 'portrait'}; margin: 10mm; }`;
}

// ---- Rotas designed for sending to carers (PDF) ----
// Days not working all show as "Day off", so nobody's sickness or leave is shared with the whole team.
const RUN_COLOURS = [['#dbeafe', '#1e40af'], ['#dcfce7', '#166534'], ['#fef3c7', '#92400e'], ['#f3e8ff', '#6b21a8'], ['#fee2e2', '#991b1b'],
  ['#cffafe', '#155e75'], ['#fce7f3', '#9d174d'], ['#ecfccb', '#3f6212'], ['#ede9fe', '#5b21b6'], ['#ffedd5', '#9a3412']];
function runPill(runName, shadow) {
  const i = Math.max(0, state.runs.findIndex(r => r.name === runName));
  const [bg, fg] = RUN_COLOURS[i % RUN_COLOURS.length];
  return `<span class="pill ${shadow ? 'shadow' : ''}" style="background:${shadow ? '#fff' : bg};color:${fg};border-color:${fg}">${esc(runName)}${shadow ? ' · shadowing' : ''}</span>`;
}
const longDate = (iso, opts) => new Date(iso + 'T12:00:00Z').toLocaleDateString('en-GB', Object.assign({ timeZone: 'UTC' }, opts));
function pubHeader(title, subtitle) {
  const org = (state.settings.orgName || '').trim();
  return `<header class="pubhead">
    <div>${org ? `<div class="org">${esc(org)}</div>` : ''}<h1>${esc(title)}</h1>
      <div class="sub">${esc(subtitle)}</div></div>
    <div class="pubmeta">Published ${esc(longDate(todayIso(), { day: 'numeric', month: 'long', year: 'numeric' }))}</div>
  </header>`;
}
const pubFooter = () => `<footer class="pubfoot">Rotas can change – if anything looks wrong, or you can't make a shift, please contact the office.</footer>`;
const weekTitle = () => `Week commencing ${longDate(ui.week, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}`;

function openShifts() {
  const week = getWeek(state, ui.week), out = [];
  for (let d = 0; d < 7; d++) for (const r of state.runs) {
    if (!r.days[d]) continue;
    const open = getCell(week, r, d).slots.filter(sl => !sl.c).length;
    if (open) out.push({ d, run: r.name, open, note: r.gender === 'F' ? 'female carers' : r.gender === 'M' ? 'male carers' : '' });
  }
  return out;
}

function publishTeam() {
  const people = sortedCarers().filter(c => c.active !== false).map(c => ({ c, wk: carerWeek(c) })).filter(x => !x.c.agency || x.wk.some(Boolean));
  const head = DAYS.map((d, i) => `<th>${d}<span>${esc(longDate(addDays(ui.week, i), { day: 'numeric', month: 'short' }))}</span></th>`).join('');
  const rows = people.map(({ c, wk }) => `<tr><th>${esc(c.name)}</th>${wk.map(x => x
    ? `<td>${runPill(x.run, x.shadow)}${x.with.length ? `<div class="with">with ${esc(x.with.join(', '))}</div>` : ''}</td>`
    : '<td class="off">Day off</td>').join('')}<td class="n">${wk.filter(Boolean).length}</td></tr>`).join('');
  const open = openShifts();
  return `<div class="pub team">
    ${pubHeader('Team rota', weekTitle())}
    <table class="pubtable"><thead><tr><th>Carer</th>${head}<th class="n">Days</th></tr></thead><tbody>${rows}</tbody></table>
    ${open.length ? `<div class="openbox"><b>Open shifts</b> – please let the office know if you can help:

// For each carer and day this week: { run, with: [names], shadow } or null
function carerWeek(c) {
  const week = getWeek(state, ui.week);
  return DAYS.map((_, d) => {
    for (const r of state.runs) {
      if (!r.days[d]) continue;
      const cell = getCell(week, r, d);
      const ids = cell.slots.map(s => s.c);
      if (ids.includes(c.id) || cell.shadow.c === c.id) {
        return { run: r.name, shadow: cell.shadow.c === c.id, with: cellIds(cell).filter(id => id !== c.id).map(id => (byId(id) || {}).name).filter(Boolean) };
      }
    }
    return null;
  });
}

function offLabel(c, d) {
  const st = carerStatus(c, ui.week, d);
  return st.ok ? 'Off' : st.label;
}

function assign(runId, d, slot, carerId) {
  const run = runById(runId);
  const week = getWeek(state, ui.week);
  const cell = getCell(week, run, d);
  const target = slot === 'shadow' ? cell.shadow : cell.slots[Number(slot)];
  if (!carerId) {
    target.c = null; target.override = false;
    if (slot !== 'shadow') target.locked = false;
    return true;
  }
  const c = byId(carerId);
  const st = carerStatus(c, ui.week, d);
  let override = false;
  if (!st.ok) {
    if (!confirm(`${c.name} is marked "${st.label}" on ${DAYS[d]}.\n\nOverride and assign them anyway (only if agreed)?`)) return false;
    override = true;
  }
  if (!genderOk(run, c) && !confirm(`${run.name} is ${genderLabel(run.gender).toLowerCase()}. Assign ${c.name} anyway?`)) return false;
  const others = cellIds(cell).filter(id => id !== target.c).map(byId).filter(Boolean);
  const clash = others.find(o => cantPair(c, o));
  if (clash) {
    if (!confirm(`${c.name} and ${clash.name} are set to not work together. Put them on ${run.name} together anyway?`)) return false;
    override = true;
  }
  if (slot !== 'shadow' && !preferredOk(run, c)) {
    if (!confirm(`${c.name} only works ${preferredNames(c, state.runs)}. Put them on ${run.name} anyway?`)) return false;
    override = true;
  }
  if (slot !== 'shadow' && !runTypeOk(run, c)) {
    if (!confirm(`${c.name} is set to ${runTypesLabel(c).toLowerCase()}. Assign them to ${run.name} anyway?`)) return false;
    override = true;
  }
  if (slot !== 'shadow' && !allowedOk(run, c)) {
    if (!confirm(`${c.name} is not one of ${run.name}'s named carers. Assign them anyway?`)) return false;
    override = true;
  }
  // prevent double booking: offer to move them
  for (const r of state.runs) {
    if (!r.days[d]) continue;
    const other = getCell(week, r, d);
    const spots = other.slots.concat([other.shadow]);
    for (const s of spots) {
      if (s.c === carerId && s !== target) {
        if (!confirm(`${c.name} is already on ${r.name} on ${DAYS[d]}. Move them here?`)) return false;
        s.c = null; s.override = false; if ('locked' in s) s.locked = false;
      }
    }
  }
  target.c = carerId; target.override = override;
  if (slot === 'shadow') delete target.auto; // chosen by hand – auto-fill keeps it
  if (slot !== 'shadow') target.locked = true;
  return true;
}

function exportCsv() {
  const week = getWeek(state, ui.week);
  const name = id => (byId(id) || {}).name || '';
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const lines = [['Run', ...DAYS.map((d, i) => `${d} ${fmtDate(addDays(ui.week, i))}`)].map(q).join(',')];
  for (const run of state.runs) {
    lines.push([run.name, ...DAYS.map((_, d) => {
      if (!run.days[d]) return '-';
      const cell = getCell(week, run, d);
      return cell.slots.map(s => name(s.c) || '[OPEN]').join(' + ') + (cell.shadow.c ? ` + shadow: ${name(cell.shadow.c)}` : '');
    })].map(q).join(','));
  }
  download(`schedule-${ui.week}.csv`, lines.join('\r\n'), 'text/csv');
}

function download(filename, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- Excel (.xlsx) and CSV files – written and read here, so it all works offline ----------
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

// [{ name, text }] -> an uncompressed zip file (Uint8Array)
function zipFiles(files) {
  const enc = new TextEncoder(), chunks = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    const head = (size, sig) => { const v = new DataView(new ArrayBuffer(size)); v.setUint32(0, sig, true); return v; };
    const local = head(30, 0x04034b50);
    local.setUint16(4, 20, true); local.setUint16(6, 0x0800, true); local.setUint16(12, 33, true);
    local.setUint32(14, crc, true); local.setUint32(18, data.length, true); local.setUint32(22, data.length, true); local.setUint16(26, name.length, true);
    const cd = head(46, 0x02014b50);
    cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(8, 0x0800, true); cd.setUint16(14, 33, true);
    cd.setUint32(16, crc, true); cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true); cd.setUint16(28, name.length, true);
    cd.setUint32(42, offset, true);
    chunks.push(new Uint8Array(local.buffer), name, data);
    central.push(new Uint8Array(cd.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((n, c) => n + c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  const all = chunks.concat(central, [new Uint8Array(end.buffer)]);
  const out = new Uint8Array(all.reduce((n, c) => n + c.length, 0));
  let p = 0;
  for (const c of all) { out.set(c, p); p += c.length; }
  return out;
}

// zip file (ArrayBuffer) -> Map(name -> Uint8Array)
async function unzip(buf) {
  const v = new DataView(buf), dec = new TextDecoder(), out = new Map();
  let end = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (v.getUint32(i, true) === 0x06054b50) { end = i; break; }
  if (end < 0) throw new Error('This is not an Excel (.xlsx) file.');
  let p = v.getUint32(end + 16, true);
  for (let n = v.getUint16(end + 10, true); n > 0; n--) {
    const method = v.getUint16(p + 10, true), size = v.getUint32(p + 20, true);
    const nameLen = v.getUint16(p + 28, true), extraLen = v.getUint16(p + 30, true), commentLen = v.getUint16(p + 32, true);
    const local = v.getUint32(p + 42, true);
    const name = dec.decode(new Uint8Array(buf, p + 46, nameLen));
    const start = local + 30 + v.getUint16(local + 26, true) + v.getUint16(local + 28, true);
    let data = new Uint8Array(buf, start, size);
    if (method === 8) data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    else if (method !== 0) throw new Error('This Excel file uses a format the app cannot read – save it again as .xlsx or CSV.');
    out.set(name, data);
    p += 46 + nameLen + extraLen + commentLen;
  }
  return out;
}

const xmlEsc = t => String(t).replace(/[<>&"]/g, ch => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[ch]));
const colLetter = i => (i >= 26 ? colLetter(Math.floor(i / 26) - 1) : '') + String.fromCharCode(65 + (i % 26));

// sheets: [{ name, rows, widths }] -> .xlsx bytes. The first row of each sheet is bold and frozen.
function makeXlsx(sheets) {
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const files = [
    { name: '[Content_Types].xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>` },
    { name: '_rels/.rels', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: 'xl/workbook.xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}" xmlns:r="${REL}"><sheets>${sheets.map((sh, i) => `<sheet name="${xmlEsc(sh.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="${REL}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="${REL}/styles" Target="styles.xml"/></Relationships>` },
    { name: 'xl/styles.xml', text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
  ];
  sheets.forEach((sh, i) => {
    const rows = sh.rows.map((row, r) => `<row r="${r + 1}">${row.map((v, c) => {
      const ref = colLetter(c) + (r + 1), style = r === 0 ? ' s="1"' : sh.wrap ? ' s="2"' : '';
      if (typeof v === 'number') return `<c r="${ref}"${style}><v>${v}</v></c>`;
      return `<c r="${ref}"${style} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v == null ? '' : v)}</t></is></c>`;
    }).join('')}</row>`).join('');
    const cols = (sh.widths || []).map((w, c) => `<col min="${c + 1}" max="${c + 1}" width="${w}" customWidth="1"/>`).join('');
    files.push({ name: `xl/worksheets/sheet${i + 1}.xml`, text: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="${NS}"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols ? `<cols>${cols}</cols>` : ''}<sheetData>${rows}</sheetData></worksheet>` });
  });
  return zipFiles(files);
}

// .xlsx bytes -> rows of the first sheet (array of arrays of strings)
async function readXlsx(buf) {
  const files = await unzip(buf), dec = new TextDecoder(), parse = name => {
    const f = files.get(name);
    return f ? new DOMParser().parseFromString(dec.decode(f), 'application/xml') : null;
  };
  const all = (doc, tag) => doc ? [...doc.getElementsByTagNameNS('*', tag)] : [];
  const wb = parse('xl/workbook.xml');
  if (!wb) throw new Error('This is not an Excel (.xlsx) file.');
  const first = all(wb, 'sheet')[0];
  const rid = first && [...first.attributes].find(a => a.localName === 'id' && a.prefix).value;
  const rel = all(parse('xl/_rels/workbook.xml.rels'), 'Relationship').find(r => r.getAttribute('Id') === rid);
  let target = rel ? rel.getAttribute('Target') : 'worksheets/sheet1.xml';
  target = target.startsWith('/') ? target.slice(1) : 'xl/' + target;
  const shared = all(parse('xl/sharedStrings.xml'), 'si').map(si => all(si, 't').map(t => t.textContent).join(''));
  const rows = [];
  for (const row of all(parse(target), 'row')) {
    const r = Number(row.getAttribute('r')) - 1 || rows.length, out = [];
    for (const c of all(row, 'c')) {
      const col = (c.getAttribute('r') || '').replace(/\d+/g, '').split('').reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0) - 1;
      const t = c.getAttribute('t'), val = (all(c, 'v')[0] || {}).textContent;
      out[col < 0 ? out.length : col] = t === 's' ? shared[Number(val)] : t === 'inlineStr' ? all(c, 't').map(x => x.textContent).join('')
        : t === 'b' ? (val === '1' ? 'Yes' : 'No') : val == null ? '' : val;
    }
    rows[r] = Array.from(out, x => x == null ? '' : x);
  }
  return Array.from(rows, r => r || []);
}

// CSV text -> rows (handles quotes, commas or semicolons, and Excel's byte-order mark)
function readCsv(text) {
  text = text.replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/)[0];
  const sep = (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ';' : ',';
  const rows = [];
  let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') quoted = false; else cell += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === sep) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

async function readCarerFile(file) {
