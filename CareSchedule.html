<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareSchedule</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1d2330; --muted: #667085; --line: #d9dde5;
    --accent: #2563eb; --accent-text: #ffffff; --err: #c62828; --err-bg: #fdecec;
    --warn: #a15c00; --warn-bg: #fff4e0; --ok-bg: #eaf7ee; --lock: #6d28d9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 18px; margin: 0; }
  nav button { background: none; border: none; padding: 8px 12px; font-size: 14px; cursor: pointer; border-radius: 6px; color: var(--muted); }
  nav button.active { background: var(--accent); color: var(--accent-text); }
  main { padding: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 16px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .btn { display: inline-block; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; font-size: 13px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.danger { color: var(--err); }
  .btn:hover { filter: brightness(0.96); }
  input, select { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--text); }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid var(--line); padding: 6px; vertical-align: top; text-align: left; }
  th { background: #eef1f6; font-weight: 600; }
  .grid-wrap { overflow-x: auto; }
  /* fixed, equal-width day columns so Monday to Sunday fit the window without scrolling */
  .grid { table-layout: fixed; min-width: 900px; }
  .grid col.runcol { width: 104px; }
  .grid td.cell { padding: 4px; overflow: hidden; }
  .grid tbody th { font-size: 13px; padding: 4px 6px; overflow-wrap: anywhere; }
  .grid thead th { padding: 4px 6px; }
  .grid td.cell.err { background: var(--err-bg); }
  .grid td.cell.warn { background: var(--warn-bg); }
  .grid td.cell.off { background: repeating-linear-gradient(45deg, #f0f0f0, #f0f0f0 6px, #e6e6e6 6px, #e6e6e6 12px); color: var(--muted); }
  .slot { display: flex; gap: 4px; align-items: center; margin-bottom: 4px; }
  .slot select { flex: 1; min-width: 0; width: 100%; font-size: 12px; padding: 3px 2px; text-overflow: ellipsis; }
  .slot.locked select { border-color: var(--lock); box-shadow: 0 0 0 1px var(--lock) inset; }
  .lockbtn { border: none; background: none; cursor: pointer; padding: 0 2px; font-size: 13px; opacity: .45; }
  .slot.locked .lockbtn { opacity: 1; }
  .shadow select { font-style: italic; }
  .linkbtn { border: none; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 12px; }
  .issues { font-size: 11px; margin-top: 2px; line-height: 1.25; }
  .issues .e { color: var(--err); }
  .issues .w { color: var(--warn); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; background: #eef1f6; margin-right: 3px; }
  .tag.M { background: #dbeafe; } .tag.F { background: #fce7f3; }
  .tag.flag { background: #fef3c7; }
  .tag.trainee { background: #e0f2fe; }
  details.share { position: relative; display: inline-block; }
  details.share > summary { list-style: none; }
  details.share > summary::-webkit-details-marker { display: none; }
  .sharemenu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; min-width: 240px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 6px; }
  .sharemenu .smhead { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 8px 2px; }
  .sharemenu button { display: block; width: 100%; text-align: left; background: none; border: none; padding: 7px 8px; border-radius: 5px; cursor: pointer; font-size: 13px; color: var(--text); }
  .sharemenu button:hover { background: #eef2ff; }
  .viewonly { margin-bottom: 12px; padding: 10px 12px; border-radius: 8px; background: #eef2ff; border: 1px solid #a5b4fc; }
  table.leavecal { font-size: 11px; }
  table.leavecal th, table.leavecal td { padding: 2px 3px; text-align: center; min-width: 20px; }
  table.leavecal tbody th { text-align: left; white-space: nowrap; }
  table.leavecal .we { background: #f3f4f6; }
  table.leavecal th.short { background: var(--err-bg); color: var(--err); }
  .lv.rq, .lvkey.rq { background: #fef9c3; }
  .slot.found select { background: #fef08a; border-color: #ca8a04; box-shadow: 0 0 0 2px #facc15; }
  .linkbtn.name { color: var(--text); font-size: 14px; text-decoration: underline dotted; }
  .changedbar { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: var(--warn-bg); border: 1px solid #f5c26b; font-size: 13px; }
  .sharedbar { margin-top: 8px; padding: 6px 10px; border-radius: 6px; background: var(--ok-bg); border: 1px solid #86efac; font-size: 13px; }
  .carerview .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-weight: 700; font-size: 11px; border: 1px solid; }
  .carerview .pill.shadow { border-style: dashed; }
  .lv.al, .lvkey.al { background: #dbeafe; } .lv.sk, .lvkey.sk { background: #fde2e2; } .lv.na, .lvkey.na { background: #eee; color: var(--muted); }
  .lvkey { display: inline-block; min-width: 22px; text-align: center; border-radius: 3px; margin: 0 2px 0 8px; }
  .lvkey.short { background: var(--err-bg); }
  table.leavecheck tr.err td { background: var(--err-bg); }
  .btn.final { border-color: #16a34a; color: #15803d; }
  .multi { display: inline-flex; }
  .multi .btn { border-radius: 6px 0 0 6px; }
  .multi select { border-radius: 0 6px 6px 0; border-left: none; }
  .finalbar { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: var(--ok-bg); border: 1px solid #86efac; font-size: 13px; }
  .btn:disabled, select:disabled { opacity: .55; cursor: not-allowed; }
  .panel.sick { border-color: #f5c26b; }
  .panel.cover { border-color: var(--accent); }
  .coveritem { border-top: 1px solid var(--line); padding: 8px 0; }
  .picks { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .btn.pick { text-align: left; font-size: 12px; }
  .why { margin: 4px 0; padding-left: 18px; font-size: 12px; }
  .linkbtn.cover { display: block; margin-bottom: 2px; color: var(--err); }
  .tag.agency { background: #ede9fe; }
  .tag.drv { background: #dcfce7; } .tag.nodrv { background: #f3f4f6; color: var(--muted); }
  .muted { color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 10px; }
  .row label { display: flex; gap: 6px; align-items: center; }
  .days label { gap: 3px; margin-right: 6px; }
  .report { white-space: pre-wrap; font-size: 13px; }
  .under { color: var(--warn); font-weight: 600; } .over { color: var(--err); font-weight: 600; } .met { color: #1b7f3b; font-weight: 600; }
  .legend { font-size: 12px; color: var(--muted); }
  #print-area { display: none; }
  @media print {
    body > header, main > *:not(#print-area) { display: none !important; }
    #print-area { display: block; }
    #print-area table { font-size: 11px; }
    #print-area .sheet { page-break-after: always; break-after: page; }
    #print-area .pub { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; color: #1f2937; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #print-area .pubhead { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid #2563eb; padding-bottom: 8px; margin-bottom: 12px; }
    #print-area .pubhead .org { font-size: 13px; font-weight: 700; color: #2563eb; text-transform: uppercase; letter-spacing: .06em; }
    #print-area .pubhead h1 { margin: 2px 0; font-size: 26px; }
    #print-area .pubhead .sub { font-size: 14px; color: #4b5563; }
    #print-area .pubmeta { font-size: 11px; color: #6b7280; text-align: right; }
    #print-area table.pubtable { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 11.5px; }
    #print-area .pubtable th, #print-area .pubtable td { border: none; border-bottom: 1px solid #e5e7eb; padding: 6px 5px; vertical-align: top; }
    #print-area .pubtable thead th { background: #1e3a8a; color: #fff; font-size: 12px; text-align: left; }
    #print-area .pubtable thead th span { display: block; font-weight: 400; font-size: 10.5px; opacity: .85; }
    #print-area .pubtable thead th:first-child { border-radius: 6px 0 0 0; } #print-area .pubtable thead th:last-child { border-radius: 0 6px 0 0; }
    #print-area .pubtable tbody th { text-align: left; font-weight: 600; white-space: nowrap; background: #f8fafc; }
    #print-area .pubtable tbody tr:nth-child(even) td { background: #fafafa; }
    #print-area .pubtable tr { break-inside: avoid; }
    #print-area .pubtable td.off { color: #9ca3af; font-style: italic; }
    #print-area .pubtable .n { text-align: center; width: 40px; }
    #print-area .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-weight: 700; font-size: 11px; border: 1px solid; }
    #print-area .pill.shadow { border-style: dashed; font-weight: 600; }
    #print-area .with { font-size: 10px; color: #4b5563; margin-top: 2px; }
    #print-area .openbox { margin-top: 12px; padding: 8px 10px; border: 1px solid #f59e0b; background: #fffbeb; border-radius: 8px; font-size: 12px; }
    #print-area .openchip { display: inline-block; margin: 4px 4px 0 0; padding: 2px 8px; border-radius: 999px; background: #fff; border: 1px solid #f59e0b; font-size: 11px; }
    #print-area .pubfoot { margin-top: 14px; padding-top: 6px; border-top: 1px solid #e5e7eb; font-size: 10.5px; color: #6b7280; }
    #print-area .pub.sheet .pubhead h1 { font-size: 30px; }
    #print-area .days { border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
    #print-area .day { display: flex; align-items: center; min-height: 64px; border-bottom: 1px solid #e5e7eb; }
    #print-area .day:last-child { border-bottom: none; }
    #print-area .day .dname { width: 160px; padding: 10px 14px; font-weight: 700; font-size: 16px; background: #f8fafc; align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
    #print-area .day .dname span { font-weight: 400; font-size: 12px; color: #6b7280; }
    #print-area .day .dbody { padding: 10px 14px; font-size: 14px; }
    #print-area .day .dbody .pill { font-size: 14px; padding: 4px 12px; }
    #print-area .day .dbody .with { font-size: 12px; margin-top: 4px; }
    #print-area .day.off .dname { color: #9ca3af; } #print-area .offtext { color: #9ca3af; font-style: italic; }
    #print-area .summary { margin-top: 12px; font-size: 13px; }
    #print-area .changenote { margin-bottom: 10px; padding: 8px 10px; background: #fffbeb; border: 1px solid #f59e0b; border-radius: 8px; font-size: 13px; }
    #print-area .chg { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; background: #f59e0b; color: #fff; font-size: 11px; font-weight: 700; }
    #print-area .day.changed { background: #fffbeb; } #print-area .day.changed .dname { background: #fef3c7; }
    #print-area .was { font-size: 11px; color: #92400e; margin-top: 3px; }
    #print-area .sheet table { font-size: 14px; }
    #print-area .sheet td, #print-area .sheet th { padding: 8px; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<header>
  <h1>CareSchedule</h1>
  <nav id="tabs">
    <button data-tab="schedule">Schedule</button>
    <button data-tab="carers">Carers</button>
    <button data-tab="runs">Runs</button>
    <button data-tab="leave">Leave</button>
    <button data-tab="reports">Reports</button>
    <button data-tab="settings">Settings &amp; Data</button>
  </nav>
  <span style="flex:1"></span>
  <button class="btn" id="undoBtn" title="Undo the last change (Ctrl+Z / ⌘Z)" disabled>↶ Undo</button>
</header>
<main id="app"></main>

<script>
// ===== ENGINE START (pure scheduling logic, no DOM – also used by tests) =====
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

function uid() { return Math.random().toString(36).slice(2, 10); }

function addDays(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
}

function mondayOf(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const wd = (new Date(Date.UTC(y, m - 1, d)).getUTCDay() + 6) % 7;
  return addDays(iso, -wd);
}

function todayIso() {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
}

function newState() {
  return {
    version: 1,
    carers: [],
    runs: [],
    weeks: {},
    settings: { genderPriority: 'M', secondPass: true, useOvertime: true, weekendRule: true, maxInARow: 5, useAgency: true },
  };
}

function slotCount(run) { return run.type === 'double' ? 2 : 1; }

function getWeek(state, weekStart) {
  if (!state.weeks[weekStart]) state.weeks[weekStart] = { cells: {} };
  return state.weeks[weekStart];
}

// Returns the cell for run/day, creating it and resizing its slots to match the run type.
function getCell(week, run, d) {
  const byDay = week.cells[run.id] || (week.cells[run.id] = {});
  const cell = byDay[d] || (byDay[d] = { slots: [], shadow: { c: null, override: false } });
  const n = slotCount(run);
  while (cell.slots.length < n) cell.slots.push({ c: null, locked: false, override: false });
  if (cell.slots.length > n) cell.slots.length = n;
  if (!cell.shadow) cell.shadow = { c: null, override: false };
  return cell;
}

// Annual leave or sickness covering a date. Day-off requests ('REQ') are kept in the same list but are only a
// preference – see requestOn().
function leaveOn(carer, iso) {
  return (carer.leave || []).find(l => l.type !== 'REQ' && l.from && l.from <= iso && iso <= (l.to || l.from)) || null;
}
function requestOn(carer, iso) {
  return (carer.leave || []).find(l => l.type === 'REQ' && l.from && l.from <= iso && iso <= (l.to || l.from)) || null;
}

// A regular working pattern: carer.pattern = { days: [7 × bool], every: 1 or 2, from: a Monday (for every 2 weeks) }.
function hasPattern(carer) { return !!(carer.pattern && carer.pattern.days && carer.pattern.days.some(Boolean)); }
function onPattern(carer, weekStart, d) {
  if (!hasPattern(carer) || !carer.pattern.days[d]) return false;
  if (Number(carer.pattern.every) !== 2) return true;
  const weeks = Math.round((Date.parse(weekStart) - Date.parse(mondayOf(carer.pattern.from || weekStart))) / (7 * 864e5));
  return ((weeks % 2) + 2) % 2 === 0;
}

// Whether a carer can be auto-assigned on day index d of the week starting weekStart.
function carerStatus(carer, weekStart, d) {
  if (carer.active === false) return { ok: false, code: 'INACTIVE', label: 'Inactive' };
  if (!carer.available[d]) return { ok: false, code: 'NA', label: 'Not available' };
  const l = leaveOn(carer, addDays(weekStart, d));
  if (l) return { ok: false, code: l.type, label: l.type === 'AL' ? 'Annual leave' : 'Sickness' };
  return { ok: true };
}

function preferredNames(carer, runs) {
  return (carer.preferredRuns || []).map(id => runs.find(r => r.id === id)).filter(Boolean).map(r => r.name).join(', ');
}

function genderOk(run, carer) { return run.gender === 'any' || run.gender === carer.gender; }

// carer.runTypes: 'both' (default), 'double' (double-ups only) or 'single' (singles only)
function runTypeOk(run, carer) {
  const t = carer.runTypes || 'both';
  return t === 'both' || t === (run.type === 'double' ? 'double' : 'single');
}
// carer.notWith: ids of carers they must not be put on the same run with on the same day (either side counts)
function cantPair(a, b) {
  return a.id !== b.id && ((a.notWith || []).includes(b.id) || (b.notWith || []).includes(a.id));
}

// carer.preferredRuns: run ids they prefer; with carer.onlyPreferred they are never put on any other run
function prefersRun(carer, run) { return (carer.preferredRuns || []).includes(run.id); }
function preferredOk(run, carer) { return !carer.onlyPreferred || !(carer.preferredRuns || []).length || prefersRun(carer, run); }

function runTypesLabel(carer) {
  const t = carer.runTypes || 'both';
  return t === 'double' ? 'Double-ups only' : t === 'single' ? 'Singles only' : 'Doubles & singles';
}

function capacity(carer, withOvertime) {
  return Math.min(7, Number(carer.daysPerWeek || 0) + (withOvertime && carer.overtime ? 1 : 0));
}

function cellCarers(cell) {
  const ids = cell.slots.map(s => s.c).filter(Boolean);
  if (cell.shadow && cell.shadow.c) ids.push(cell.shadow.c);
  return ids;
}

// booked[d] = Set of carer ids working that day; worked[id] = Set of day indexes.
function computeBookings(state, week) {
  const booked = DAYS.map(() => new Set());
  const worked = {};
  for (const c of state.carers) worked[c.id] = new Set();
  for (const run of state.runs) {
    for (let d = 0; d < 7; d++) {
      if (!run.days[d]) continue;
      for (const id of cellCarers(getCell(week, run, d))) {
        booked[d].add(id);
        if (worked[id]) worked[id].add(d);
      }
    }
  }
  return { booked, worked };
}

const HISTORY_WEEKS = 13; // about 3 months
const ROTATION_WEEKS = 3; // weeks to stay on the same pair of runs before swapping

function needsDriver(run) { return run.needsDriver !== false; }
function isSpecific(run) { return !!(run.allowed && run.allowed.length); }
function allowedOk(run, carer) { return !isSpecific(run) || run.allowed.includes(carer.id); }

// What each carer worked in the HISTORY_WEEKS weeks before weekStart, oldest first.
// Only weeks that have a schedule in the app count; weekends[i] is null for a week with no schedule.
function history(state, weekStart, weeks) {
  weeks = weeks || HISTORY_WEEKS;
  const h = {};
  for (const c of state.carers) h[c.id] = { days: [], weekRuns: [], total: 0, lastWeek: DAYS.map(() => null), weekends: [] };
  for (let w = weeks; w >= 1; w--) {
    const week = state.weeks[addDays(weekStart, -7 * w)];
    const onRun = DAYS.map(() => ({})); // onRun[d][carerId] = runId
    if (week) {
      for (const run of state.runs) {
        for (let d = 0; d < 7; d++) {
          const cell = run.days[d] && week.cells[run.id] && week.cells[run.id][d];
          if (cell) for (const id of cellCarers(cell)) onRun[d][id] = run.id;
        }
      }
    }
    for (const c of state.carers) {
      const e = h[c.id];
      const runs = {};
      for (let d = 0; d < 7; d++) {
        const r = onRun[d][c.id];
        e.days.push(!!r);
        if (r) { runs[r] = (runs[r] || 0) + 1; e.total++; }
        if (w === 1) e.lastWeek[d] = r || null;
      }
      e.weekRuns.push(runs);
      e.weekends.push(week ? !!(onRun[5][c.id] || onRun[6][c.id]) : null);
    }
  }
  return h;
}

// days[i] = whether each carer works day i of the week starting weekStart (empty if no schedule that week)
function weekDays(state, weekStart) {
  const week = state.weeks[weekStart];
  const out = {};
  for (const c of state.carers) out[c.id] = DAYS.map(() => false);
  if (!week) return out;
  for (const run of state.runs) {
    for (let d = 0; d < 7; d++) {
      const cell = run.days[d] && week.cells[run.id] && week.cells[run.id][d];
      if (cell) for (const id of cellCarers(cell)) if (out[id]) out[id][d] = true;
    }
  }
  return out;
}

// Longest run of consecutive working days that touches this week, looking back into history and
// forward into next week if it has already been scheduled. working(d) covers d from -7*HISTORY_WEEKS to 13.
function longestStretch(working) {
  let best = 0, cur = 0;
  for (let d = -7 * HISTORY_WEEKS; d <= 13; d++) {
    cur = working(d) ? cur + 1 : 0;
    if (cur && d >= 0 && d <= 6) best = Math.max(best, cur);
    if (cur && d > 6 && cur > d - 6) best = Math.max(best, cur); // stretch that started this week
  }
  return best;
}

const LONG_STRETCH = 6; // after this many working days in a row...
const REST_DAYS = 2;    // ...the carer must have this many days off in a row

// Places where a carer goes back to work too soon after a long stretch: a stretch of LONG_STRETCH+ working days
// followed by work again within REST_DAYS. Scans days `from`..`to` using working(d); returns
// [{ end, length, back }] where `back` is the day they are working again.
function restBreaches(working, from, to) {
  const out = [];
  let len = 0;
  for (let d = from; d <= to; d++) {
    if (working(d)) { len++; continue; }
    if (len >= LONG_STRETCH) {
      for (let k = 0; k < REST_DAYS; k++) {
        if (d + k <= to && working(d + k)) { out.push({ end: d - 1, length: len, back: d + k }); break; }
      }
    }
    len = 0;
  }
  return out;
}

// Number of weekends in a row worked, counting back from last week.
function weekendStreak(h) {
  let n = 0;
  for (let i = h.weekends.length - 1; i >= 0 && h.weekends[i] === true; i--) n++;
  return n;
}

// The carer's current pair of runs (their 2 most-worked runs in their latest working week) and how many
// weeks in a row they have mostly worked on that pair.
function rotation(h) {
  let i = h.weekRuns.length - 1;
  while (i >= 0 && !Object.keys(h.weekRuns[i]).length) i--;
  if (i < 0) return { runs: [], streak: 0 };
  const runs = Object.entries(h.weekRuns[i]).sort((a, b) => b[1] - a[1]).slice(0, 2).map(x => x[0]);
  let streak = 0;
  for (; i >= 0; i--) {
    const counts = Object.entries(h.weekRuns[i]);
    const total = counts.reduce((n, [, v]) => n + v, 0);
    if (!total) continue; // a week off (leave etc.) doesn't break the run pair
    const onPair = counts.reduce((n, [r, v]) => n + (runs.includes(r) ? v : 0), 0);
    if (onPair / total >= 0.6) streak++; else break;
  }
  return { runs, streak };
}

// Weights for the "soft" preferences when several carers could fill a slot.
const WEIGHTS = {
  contract: 3,          // carers who need most of their remaining available days to meet their contract
  fairShare: 2,         // carers with the biggest share of their week still unbooked – spreads any spare days fairly
  gender: 2,            // preferred gender first (males by default) on mixed runs
  continuity: 1,        // works the day before/after – keeps working days (and so days off) together
  loneDayOff: 2,        // would leave a single day off sandwiched between working days
  weekendDue: 4,        // worked last weekend – aim for a weekend off every 2 weeks
  weekendPair: 1.5,     // work Sat+Sun together (or neither) so weekends off are whole weekends
  sameRunAsYesterday: 1.5, // same run as the day before/after – keeps runs in blocks of days
  weekRuns: 1.5,        // a run they already have this week
  thirdRun: 2.5,        // would be a 3rd different run this week
  dayOffRequest: 8,     // the carer asked for this day off
  patternDay: 4,        // one of the days the carer usually works
  offPattern: 2,        // not one of their usual days
  preferredRun: 4,      // one of the carer's preferred runs (also exempt from the run-pair rotation)
  keepRotation: 2,      // on their current pair of runs, within ROTATION_WEEKS
  swapRotation: 3,      // done ROTATION_WEEKS on the same pair – move them on
  random: 2,            // shuffle so allocation is random, not by name or list order
};

function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Order runs are filled in each day: person-specific runs first, then male/female-only runs, then the rest.
// Runs in the same group are shuffled.
function orderedRuns(runs, rng) {
  const rank = r => isSpecific(r) ? 0 : r.gender !== 'any' ? 1 : 2;
  return shuffle(runs.slice(), rng).sort((a, b) => rank(a) - rank(b));
}

function clearUnlocked(state, weekStart) {
  const week = getWeek(state, weekStart);
  for (const run of state.runs) {
    for (let d = 0; d < 7; d++) {
      const cell = getCell(week, run, d);
      for (const s of cell.slots) {
        if (!s.locked) { s.c = null; s.override = false; }
      }
      if (cell.shadow.auto) cell.shadow = { c: null, override: false }; // trainee shadows placed by auto-fill
    }
  }
}

// A trainee (carer.traineeUntil = 'YYYY-MM-DD') only shadows, up to and including that date.
function inTraining(carer, date) { return !!carer.traineeUntil && date <= carer.traineeUntil; }
const ukDate = iso => iso.split('-').reverse().join('/');

/*
 * Auto-fill the week, one day at a time – Saturday and Sunday first, then Monday to Friday.
 *  Pass 1 (contracted days only):
 *    0) runs limited to specific carers (their carers are kept for them in this pass)
 *    a) every double-up run gets a driver
 *    b) the second slot on double-ups is filled with NON-drivers only (drivers are saved for driver slots)
 *    c) single runs get a driver
 *  Pass 2 (optional): fill any remaining gaps with whoever is still free that day – including
 *    spare drivers – and, if enabled, carers who have agreed to one overtime day.
 * Locked (manually chosen) slots are never changed.
 */
function autoFill(state, weekStart, opts) {
  if (getWeek(state, weekStart).final) {
    return { log: ['This week is finalised – reopen it to change it.'], issues: validate(state, weekStart), finalised: true };
  }
  opts = Object.assign({}, state.settings, opts || {});
  const week = getWeek(state, weekStart);
  clearUnlocked(state, weekStart);
  const { booked, worked } = computeBookings(state, week);
  // agency staff are kept out of every regular step and only fill gaps left at the end
  const carers = state.carers.filter(c => c.active !== false && !c.agency);
  const agency = state.carers.filter(c => c.active !== false && c.agency);
  const log = [];
  const rng = opts.random || Math.random;
  const hist = history(state, weekStart);
  const streak = {}, rot = {};
  for (const c of carers) { streak[c.id] = weekendStreak(hist[c.id]); rot[c.id] = rotation(hist[c.id]); }
  for (const c of agency) { streak[c.id] = 0; rot[c.id] = { runs: [], streak: 0 }; }
  const runCount = {}; // runCount[carerId][runId] this week
  const dayRun = {};   // dayRun[carerId][d] = runId this week
  for (const c of state.carers) { runCount[c.id] = {}; dayRun[c.id] = {}; }
  for (const run of state.runs) for (let d = 0; d < 7; d++) {
    if (!run.days[d]) continue;
    for (const id of cellCarers(getCell(week, run, d))) {
      if (!runCount[id]) continue;
      runCount[id][run.id] = (runCount[id][run.id] || 0) + 1;
      dayRun[id][d] = run.id;
    }
  }
  // Weekends are the hardest days to cover under the weekend-off rules, so they are planned first.
  const DAY_ORDER = [5, 6, 0, 1, 2, 3, 4];
  const planned = new Set(); // days already filled in this auto-fill
  // worked on day d of this week (negative d looks back into last week); null if not planned yet
  const workedOn = (c, d) => d < 0 ? !!hist[c.id].days[hist[c.id].days.length + d]
    : d > 6 ? null : planned.has(d) || booked[d].has(c.id) ? booked[d].has(c.id) : null;
  const runOn = (c, d) => d < 0 ? hist[c.id].lastWeek[7 + d] : d > 6 ? null : dayRun[c.id][d];

  const statusCache = {};
  const ok = (c, d) => {
    const k = c.id + d;
    if (!(k in statusCache)) statusCache[k] = carerStatus(c, weekStart, d).ok;
    return statusCache[k];
  };
  // days still to plan (including d) that the carer could work
  const remainingAvail = (c, d) => {
    let n = 0;
    for (let e = 0; e < 7; e++) if ((e === d || !planned.has(e)) && ok(c, e) && !booked[e].has(c.id)) n++;
    return Math.max(1, n);
  };
  // carers named on a person-specific run are kept for those runs in pass 1; their spare weekdays are used
  // in pass 2, but their weekends stay free so the specific run can be covered while they still get weekends off
  const reserved = new Set(state.runs.filter(isSpecific).flatMap(r => r.allowed));
  const genderRank = c => opts.genderPriority === 'none' ? 0 : (c.gender === opts.genderPriority ? 0 : 1);
  // anyone who has worked the last 2 weekends gets this one off – never 3 weekends in a row
  const weekendBlocked = (c, d) => d >= 5 && opts.weekendRule !== false && streak[c.id] >= 2;
  // never more than maxInARow working days in a row, counting last week's days and next week's (if scheduled)
  const nextWeek = weekDays(state, addDays(weekStart, 7));
  const isWorking = (c, d) => d < 0 ? !!hist[c.id].days[hist[c.id].days.length + d]
    : d > 6 ? nextWeek[c.id][d - 7] : booked[d].has(c.id);
  const maxInARow = Number(opts.maxInARow) || 0;
  // length of the working stretch the carer would be on if they also worked day d
  const stretchWith = (c, d) => {
    let n = 1;
    for (let e = d - 1; isWorking(c, e) && n <= 14; e--) n++;
    for (let e = d + 1; e <= 13 && isWorking(c, e) && n <= 14; e++) n++;
    return n;
  };
  const tooManyInARow = (c, d) => maxInARow > 0 && stretchWith(c, d) > maxInARow;
  // working day d must not cut short the 2 days off owed after a 6+ day stretch (or create a stretch that does)
  const breaksRest = (c, d) => restBreaches(e => e === d || isWorking(c, e), d - 3 * 7, 13)
    .some(b => b.back === d || (b.end - b.length < d && d <= b.end));

  // every hard rule except the days-in-a-row limit and days per week, which callers check
  const carerById = Object.fromEntries(state.carers.map(c => [c.id, c]));
  const clashes = (c, cell) => cellCarers(cell).some(id => carerById[id] && cantPair(c, carerById[id]));
  // Stagger weekends: every carer who works this weekend after working last weekend must have next weekend off,
  // so only let as many of them work as still leaves enough people to cover next weekend.
  const weekendSlots = Math.max(...[5, 6].map(d => state.runs.filter(r => r.days[d]).reduce((n, r) => n + slotCount(r), 0)));
  const weekendPool = carers.filter(c => c.available[5] || c.available[6]).length;
  const secondWeekendQuota = Math.max(0, weekendPool - weekendSlots);
  const secondWeekend = new Set(carers.filter(c => streak[c.id] === 1 && (booked[5].has(c.id) || booked[6].has(c.id))).map(c => c.id));
  const overQuota = (c, d) => d >= 5 && opts.weekendRule !== false && streak[c.id] === 1 &&
    !secondWeekend.has(c.id) && secondWeekend.size >= secondWeekendQuota;
  const training = (c, d) => inTraining(c, addDays(weekStart, d));
  const requested = (c, d) => !!requestOn(c, addDays(weekStart, d));
  const allowedHere = (c, run, d, rule, passNo, cell) =>
    !(passNo === 1 && requested(c, d)) && !training(c, d) && !clashes(c, cell) && !overQuota(c, d) && genderOk(run, c) && runTypeOk(run, c) && preferredOk(run, c) && allowedOk(run, c) && ok(c, d) && !booked[d].has(c.id) &&
    !weekendBlocked(c, d) &&
    !(reserved.has(c.id) && !isSpecific(run) && (passNo === 1 || d >= 5)) &&
    (!rule.needDriver || c.driver) &&
    (!rule.nonDriverOnly || !c.driver);
  const eligible = (c, run, d, rule, cap, passNo, cell) =>
    allowedHere(c, run, d, rule, passNo, cell) && !tooManyInARow(c, d) && !breaksRest(c, d) && worked[c.id].size < cap(c);

  const place = (c, run, d, cell, idx) => {
    cell.slots[idx].c = c.id;
    booked[d].add(c.id);
    worked[c.id].add(d);
    runCount[c.id][run.id] = (runCount[c.id][run.id] || 0) + 1;
    dayRun[c.id][d] = run.id;
    if (d >= 5 && streak[c.id] === 1) secondWeekend.add(c.id);
  };
  const unplace = (c, run, d, cell, idx) => {
    cell.slots[idx].c = null;
    booked[d].delete(c.id);
    worked[c.id].delete(d);
    runCount[c.id][run.id]--;
    if (!runCount[c.id][run.id]) delete runCount[c.id][run.id];
    delete dayRun[c.id][d];
    if (d >= 5 && !booked[5].has(c.id) && !booked[6].has(c.id)) secondWeekend.delete(c.id);
  };

  // days a carer should work this week: their days per week, less days marked unavailable / leave / sickness
  const target = c => Math.min(Number(c.daysPerWeek || 0), DAYS.filter((_, d) => ok(c, d)).length);
  const overtime = c => worked[c.id].size >= Number(c.daysPerWeek || 0) ? 1 : 0;
  const short = c => worked[c.id].size < target(c) ? 0 : 1;

  function pick(run, d, cell, idx, rule, cap, passNo, pool) {
    const cands = (pool || carers).filter(c => eligible(c, run, d, rule, cap, passNo, cell));
    if (!cands.length) return false;
    const score = c => {
      const left = cap(c) - worked[c.id].size;
      let soft = WEIGHTS.contract * Math.min(1, left / remainingAvail(c, d)) + WEIGHTS.fairShare * left / Math.max(1, cap(c));
      if (run.gender === 'any' && genderRank(c) === 0) soft += WEIGHTS.gender;
      if (workedOn(c, d - 1) || workedOn(c, d + 1)) soft += WEIGHTS.continuity;
      if (workedOn(c, d - 1) === false && workedOn(c, d - 2)) soft -= WEIGHTS.loneDayOff;
      if (workedOn(c, d + 1) === false && workedOn(c, d + 2)) soft -= WEIGHTS.loneDayOff;
      if (d >= 5 && streak[c.id] >= 1) soft -= WEIGHTS.weekendDue;
      if (d === 6) soft += workedOn(c, 5) ? WEIGHTS.weekendPair : -WEIGHTS.weekendPair;
      if (runOn(c, d - 1) === run.id || runOn(c, d + 1) === run.id) soft += WEIGHTS.sameRunAsYesterday;
      const thisWeek = Object.keys(runCount[c.id]);
      if (thisWeek.includes(run.id)) soft += WEIGHTS.weekRuns;
      else if (thisWeek.length >= 2) soft -= WEIGHTS.thirdRun;
      const r = rot[c.id];
      if (requested(c, d)) soft -= WEIGHTS.dayOffRequest;
      if (hasPattern(c)) soft += onPattern(c, weekStart, d) ? WEIGHTS.patternDay : -WEIGHTS.offPattern;
      if (prefersRun(c, run)) soft += WEIGHTS.preferredRun;
      else if (state.runs.some(p => p.days[d] && prefersRun(c, p) && getCell(week, p, d).slots.some(sl => !sl.c))) {
        soft -= WEIGHTS.preferredRun; // their preferred run still has a space today
      }
      else if (r.runs.length) {
        const onPair = r.runs.includes(run.id);
        if (r.streak < ROTATION_WEEKS) soft += onPair ? WEIGHTS.keepRotation : -WEIGHTS.keepRotation / 2;
        else soft += onPair ? -WEIGHTS.swapRotation : WEIGHTS.swapRotation / 2;
      }
      soft += WEIGHTS.random * rng();
      return { urgent: left >= remainingAvail(c, d) ? 0 : 1, soft };
    };
    const scores = new Map(cands.map(c => [c, score(c)]));
    cands.sort((a, b) => {
      const sa = scores.get(a), sb = scores.get(b);
      return (overtime(a) - overtime(b)) ||                // an overtime day only when no one else can do it
        (sa.urgent - sb.urgent) ||                         // must work every remaining day to hit contract
        (!rule.needDriver ? (a.driver - b.driver) : 0) ||  // keep drivers free where a driver isn't needed
        (sb.soft - sa.soft);                               // weighted preferences (see WEIGHTS)
    });
    place(cands[0], run, d, cell, idx);
    return true;
  }

  // Fill a gap that carer c could cover except for the days-in-a-row / rest rules or having used up their days:
  // hand one of c's other shifts to someone else (a carer short of their days first), then put c in the gap.
  function swapIntoGap(run, d, cell, idx, cap) {
    const rule = { needDriver: needsDriver(run) && !hasDriver(cell) };
    const blocked = shuffle(carers.filter(c => allowedHere(c, run, d, rule, 2, cell) &&
      !eligible(c, run, d, rule, cap, 2, cell) && worked[c.id].size <= cap(c)), rng);
    for (const c of blocked) {
      for (const e of shuffle([...worked[c.id]], rng)) {
        const spot = state.runs.filter(r => r.days[e]).map(r => ({ r, cell: getCell(week, r, e) }))
          .map(x => Object.assign(x, { i: x.cell.slots.findIndex(sl => sl.c === c.id && !sl.locked) }))
          .find(x => x.i >= 0);
        if (!spot) continue;
        unplace(c, spot.r, e, spot.cell, spot.i);
        if (!tooManyInARow(c, d) && !breaksRest(c, d) && worked[c.id].size < cap(c)) {
          const ruleE = { needDriver: needsDriver(spot.r) && !hasDriver(spot.cell) };
          const y = shuffle(carers.filter(y => y !== c && eligible(y, spot.r, e, ruleE, cap, 2, spot.cell)), rng)
            .sort((a, b) => short(a) - short(b) || overtime(a) - overtime(b))[0];
          if (y) {
            place(y, spot.r, e, spot.cell, spot.i);
            place(c, run, d, cell, idx);
            return true;
          }
        }
        place(c, spot.r, e, spot.cell, spot.i); // undo
      }
    }
    return false;
  }

  // A carer short of their days takes a shift from someone on an overtime day.
  function topUp() {
    let moved = 0;
    const contractCap = c => capacity(c, false);
    for (const a of shuffle(carers.filter(c => short(c) === 0), rng)) {
      for (const d of shuffle([0, 1, 2, 3, 4, 5, 6], rng)) {
        if (short(a) || booked[d].has(a.id) || !ok(a, d)) continue;
        const spots = state.runs.filter(r => r.days[d]).flatMap(r => {
          const cell = getCell(week, r, d);
          return cell.slots.map((sl, i) => ({ r, cell, i, b: carerById[sl.c], locked: sl.locked }));
        }).filter(x => x.b && !x.locked && worked[x.b.id].size > Number(x.b.daysPerWeek || 0));
        for (const x of spots) {
          unplace(x.b, x.r, d, x.cell, x.i);
          const rule = { needDriver: needsDriver(x.r) && !hasDriver(x.cell) };
          if (eligible(a, x.r, d, rule, contractCap, 2, x.cell)) { place(a, x.r, d, x.cell, x.i); moved++; break; }
          place(x.b, x.r, d, x.cell, x.i);
        }
      }
    }
    return moved;
  }

  // Same-day swaps that move carers onto their preferred runs: c (on another run) swaps with q (on c's preferred run).
  function preferenceSwaps() {
    let swapped = 0;
    const cap = c => capacity(c, true);
    const spotOf = (c, d) => {
      for (const r of state.runs) {
        if (!r.days[d]) continue;
        const cell = getCell(week, r, d);
        const i = cell.slots.findIndex(sl => sl.c === c.id && !sl.locked);
        if (i >= 0) return { r, cell, i };
      }
      return null;
    };
    for (const c of shuffle(carers.filter(c => (c.preferredRuns || []).length), rng)) {
      for (let d = 0; d < 7; d++) {
        const from = spotOf(c, d);
        if (!from || prefersRun(c, from.r)) continue;
        const targets = state.runs.filter(p => p.days[d] && prefersRun(c, p)).flatMap(p => {
          const cell = getCell(week, p, d);
          return cell.slots.map((sl, i) => ({ r: p, cell, i, q: carerById[sl.c], locked: sl.locked }));
        }).filter(x => x.q && !x.locked && x.q !== c && !prefersRun(x.q, x.r));
        for (const to of targets) {
          unplace(c, from.r, d, from.cell, from.i);
          unplace(to.q, to.r, d, to.cell, to.i);
          const ruleTo = { needDriver: needsDriver(to.r) && !hasDriver(to.cell) };
          let ok = eligible(c, to.r, d, ruleTo, cap, 2, to.cell);
          if (ok) {
            place(c, to.r, d, to.cell, to.i);
            const ruleFrom = { needDriver: needsDriver(from.r) && !hasDriver(from.cell) };
            ok = eligible(to.q, from.r, d, ruleFrom, cap, 2, from.cell);
            if (ok) { place(to.q, from.r, d, from.cell, from.i); swapped++; break; }
            unplace(c, to.r, d, to.cell, to.i);
          }
          place(c, from.r, d, from.cell, from.i);
          place(to.q, to.r, d, to.cell, to.i);
        }
      }
    }
    return swapped;
  }

  // Trainees shadow an experienced carer on their training days (in the shadow place, never a normal slot).
  function shadowPass() {
    let placed = 0;
    const cap = c => capacity(c, false);
    for (const c of shuffle(carers.filter(c => DAYS.some((_, d) => training(c, d))), rng)) {
      for (let d = 0; d < 7; d++) {
        if (!training(c, d) || requested(c, d) || worked[c.id].size >= cap(c) || !ok(c, d) || booked[d].has(c.id) ||
          weekendBlocked(c, d) || tooManyInARow(c, d) || breaksRest(c, d)) continue;
        const options = state.runs.filter(r => r.days[d] && genderOk(r, c)).map(r => ({ r, cell: getCell(week, r, d) }))
          .filter(x => !x.cell.shadow.c && !clashes(c, x.cell) &&
            x.cell.slots.some(sl => sl.c && carerById[sl.c] && !training(carerById[sl.c], d) && !carerById[sl.c].agency));
        if (!options.length) continue;
        const pref = x => (runOn(c, d - 1) === x.r.id || runOn(c, d + 1) === x.r.id ? 2 : 0) + (prefersRun(c, x.r) ? 1 : 0) + rng();
        const best = options.map(x => ({ x, v: pref(x) })).sort((a, b) => b.v - a.v)[0].x;
        best.cell.shadow = { c: c.id, override: false, auto: true };
        booked[d].add(c.id);
        worked[c.id].add(d);
        runCount[c.id][best.r.id] = (runCount[c.id][best.r.id] || 0) + 1;
        dayRun[c.id][d] = best.r.id;
        placed++;
      }
    }
    return placed;
  }

  // Last resort: agency staff fill any slots still empty (their days per week is the most they can do).
  function agencyPass() {
    const cap = c => capacity(c, false);
    let filled = 0;
    for (const d of DAY_ORDER) {
      for (const run of orderedRuns(state.runs.filter(r => r.days[d]), rng)) {
        const cell = getCell(week, run, d);
        let i;
        while ((i = emptyIdx(cell)) >= 0) {
          const rule = { needDriver: needsDriver(run) && !hasDriver(cell) };
          if (!pick(run, d, cell, i, rule, cap, 2, agency)) break;
          filled++;
        }
      }
    }
    return filled;
  }

  function repairGaps() {
    const cap = c => capacity(c, opts.secondPass && opts.useOvertime);
    let fixed = 0;
    for (const d of DAY_ORDER) {
      for (const run of state.runs) {
        if (!run.days[d]) continue;
        const cell = getCell(week, run, d);
        let i;
        while ((i = emptyIdx(cell)) >= 0 && swapIntoGap(run, d, cell, i, cap)) fixed++;
      }
    }
    return fixed;
  }

  const hasDriver = cell => cell.slots.some(s => {
    const c = s.c && state.carers.find(x => x.id === s.c);
    return c && c.driver;
  });
  const emptyIdx = cell => cell.slots.findIndex(s => !s.c);

  function runPass(passNo) {
    const cap = c => capacity(c, passNo === 2 && opts.useOvertime);
    let filled = 0;
    const fillRest = (run, d, cell, nonDriverOnly) => {
      let i;
      while ((i = emptyIdx(cell)) >= 0 && pick(run, d, cell, i, { needDriver: false, nonDriverOnly }, cap, passNo)) filled++;
    };
    const fillDriver = (run, d, cell) => {
      const i = emptyIdx(cell);
      if (i >= 0 && needsDriver(run) && !hasDriver(cell) && pick(run, d, cell, i, { needDriver: true }, cap, passNo)) filled++;
    };
    const driverOk = (run, cell) => !needsDriver(run) || hasDriver(cell);
    for (const d of DAY_ORDER) {
      const runs = orderedRuns(state.runs.filter(r => r.days[d]), rng);
      const specific = runs.filter(isSpecific);
      const doubles = runs.filter(r => !isSpecific(r) && r.type === 'double');
      const singles = runs.filter(r => !isSpecific(r) && r.type !== 'double');
      // 0) runs limited to specific carers go first
      for (const run of specific) {
        const cell = getCell(week, run, d);
        fillDriver(run, d, cell);
        if (driverOk(run, cell)) fillRest(run, d, cell, false);
      }
      // a) driver on every double-up
      for (const run of doubles) fillDriver(run, d, getCell(week, run, d));
      // b) second carer on double-ups (once a driver is on it, if it needs one)
      for (const run of doubles) {
        const cell = getCell(week, run, d);
        if (driverOk(run, cell)) fillRest(run, d, cell, passNo === 1 && needsDriver(run));
      }
      // c) singles: a driver unless the run doesn't need one
      for (const run of singles) {
        const cell = getCell(week, run, d);
        fillDriver(run, d, cell);
        if (!needsDriver(run)) fillRest(run, d, cell, false);
      }
      planned.add(d);
    }
    return filled;
  }

  const f1 = runPass(1);
  log.push(`Pass 1: filled ${f1} slot(s).`);
  if (opts.secondPass) {
    const f2 = runPass(2);
    log.push(`Pass 2: filled ${f2} more slot(s) using spare carers${opts.useOvertime ? ' and agreed overtime' : ''}.`);
  }
  const f3 = repairGaps();
  if (f3) log.push(`Swapped shifts around to fill ${f3} more slot(s).`);
  const f4 = topUp();
  if (f4) log.push(`Moved ${f4} overtime shift(s) to carers who were short of their days.`);
  const f5 = preferenceSwaps();
  if (f5) log.push(`Swapped ${f5} shift(s) on the same day to put carers on their preferred runs.`);
  const f7 = shadowPass();
  if (f7) log.push(`Put trainees on ${f7} shadow shift(s) with experienced carers.`);
  const f6 = opts.useAgency !== false && agency.length ? agencyPass() : 0;
  if (f6) log.push(`Agency staff filled ${f6} shift(s) that no regular carer could cover.`);
  const unmet = carers.concat(agency).reduce((n, c) => n + DAYS.filter((_, d) => booked[d].has(c.id) && requested(c, d)).length, 0);
  if (unmet) log.push(`${unmet} day-off request(s) couldn't be met without leaving shifts empty – they're marked on the schedule.`);
  const shiftCount = state.runs.reduce((n, r) => n + r.days.filter(Boolean).length * slotCount(r), 0);
  const wanted = carers.reduce((n, c) => n + target(c), 0);
  const shortBy = carers.reduce((n, c) => n + Math.max(0, target(c) - worked[c.id].size), 0);
  if (shortBy) {
    log.push(`${shortBy} day(s) short of carers' profiles this week.` + (wanted > shiftCount
      ? ` There are ${shiftCount} shifts but carers are due ${wanted} days, so ${wanted - shiftCount} extra day(s) off can't be avoided.`
      : ' The weekend-off, days-in-a-row and other rules stopped those shifts being given out.'));
  }
  return { log, issues: validate(state, weekStart) };
}

// Fill only the empty slots of the week: everyone already placed stays exactly where they are.
// Works by treating every filled slot as locked for the duration of a normal auto-fill.
function fillGaps(state, weekStart, opts) {
  const week = getWeek(state, weekStart);
  if (week.final) return Object.assign(autoFill(state, weekStart, opts), { filled: 0 });
  const unlockedFilled = [];
  for (const run of state.runs) {
    for (let d = 0; d < 7; d++) {
      for (const sl of getCell(week, run, d).slots) if (sl.c && !sl.locked) { sl.locked = true; unlockedFilled.push(sl); }
    }
  }
  const empty = () => state.runs.reduce((n, r) => n + r.days.reduce((m, on, d) => m + (on ? getCell(week, r, d).slots.filter(sl => !sl.c).length : 0), 0), 0);
  const before = empty();
  let result;
  try { result = autoFill(state, weekStart, opts); } finally { for (const sl of unlockedFilled) sl.locked = false; }
  const filled = before - empty();
  result.log = [`Filled ${filled} of ${before} empty slot(s). Everyone already on the schedule was left where they were.`]
    .concat(result.log.filter(l => /Agency staff|short of carers/.test(l)));
  result.filled = filled;
  return result;
}

// Auto-fill `count` weeks starting at weekStart, in date order (each week's plan uses the ones before it).
// Finalised weeks are skipped. Returns [{ week, finalised, log, problems }].
function autoFillWeeks(state, weekStart, count, opts) {
  const out = [];
  for (let i = 0; i < count; i++) {
    const ws = addDays(weekStart, 7 * i);
    if (getWeek(state, ws).final) { out.push({ week: ws, finalised: true, log: [], problems: 0 }); continue; }
    const r = autoFill(state, ws, opts);
    out.push({ week: ws, finalised: false, log: r.log, problems: r.issues.list.filter(x => x.level === 'error').length });
  }
  return out;
}

// What a period of leave would do to cover, day by day. For each day it compares the shifts to fill with the
// carers likely to be around (each available regular carer counts as days-per-week ÷ days-available-that-week,
// i.e. their share of that day), in total, drivers, and for male-only / female-only runs. Agency staff aren't counted.
// Returns { days: [{ date, shifts, expected, short: [messages], off: [names] }], problemDays }.
function leaveImpact(state, carerId, from, to, type) {
  const days = [];
  if (!from) return { days, problemDays: 0 };
  if (!to || to < from) to = from;
  const trial = JSON.parse(JSON.stringify(state));
  const who = trial.carers.find(c => c.id === carerId);
  if (who) who.leave = (who.leave || []).concat([{ type: type || 'AL', from, to }]);
  const regulars = trial.carers.filter(c => c.active !== false && !c.agency);
  for (let date = from, n = 0; date <= to && n < 120; date = addDays(date, 1), n++) {
    const ws = mondayOf(date), d = DAYS.findIndex((_, i) => addDays(ws, i) === date);
    const runs = trial.runs.filter(r => r.days[d]);
    const need = {
      all: runs.reduce((t, r) => t + slotCount(r), 0),
      drivers: runs.filter(needsDriver).length,
      F: runs.filter(r => r.gender === 'F').reduce((t, r) => t + slotCount(r), 0),
      M: runs.filter(r => r.gender === 'M').reduce((t, r) => t + slotCount(r), 0),
    };
    const have = { all: 0, drivers: 0, F: 0, M: 0 }, off = [];
    for (const c of regulars) {
      const st = carerStatus(c, ws, d);
      if (!st.ok) { if (st.code === 'AL' || st.code === 'SICK') off.push(c.name); continue; }
      if (inTraining(c, date)) continue;
      const availDays = DAYS.filter((_, i) => carerStatus(c, ws, i).ok).length;
      const share = Math.min(Number(c.daysPerWeek || 0), availDays) / Math.max(1, availDays);
      have.all += share; have[c.gender] += share;
      if (c.driver) have.drivers += share;
    }
    const short = [];
    const fmt = x => (Math.round(x * 10) / 10).toString();
    if (have.all < need.all) short.push(`about ${fmt(have.all)} carers for ${need.all} shifts`);
    if (have.drivers < need.drivers) short.push(`about ${fmt(have.drivers)} drivers for ${need.drivers} runs needing one`);
    if (have.F < need.F) short.push(`about ${fmt(have.F)} female carers for ${need.F} female-only places`);
    if (have.M < need.M) short.push(`about ${fmt(have.M)} male carers for ${need.M} male-only places`);
    days.push({ date, shifts: need.all, expected: have.all, short, off });
  }
  return { days, problemDays: days.filter(x => x.short.length).length };
}

// Fairness over the `weeks` weeks ending with endWeek (only weeks that have a schedule count).
// One row per regular carer: { carer, weeks, days, due, short, overtime, weekendsWorked, weekendsTotal,
// longestWeekendRun, sickDays, leaveDays, shadowDays }.
function fairnessReport(state, endWeek, weeks) {
  const list = [];
  for (let i = weeks - 1; i >= 0; i--) { const ws = addDays(endWeek, -7 * i); if (state.weeks[ws]) list.push(ws); }
  const rows = state.carers.filter(c => !c.agency).map(c => ({ carer: c, weeks: list.length, days: 0, due: 0, short: 0, overtime: 0,
    weekendsWorked: 0, weekendsTotal: 0, longestWeekendRun: 0, run: 0, sickDays: 0, leaveDays: 0, shadowDays: 0 }));
  for (const ws of list) {
    const v = validate(state, ws), week = state.weeks[ws];
    for (const row of rows) {
      const c = row.carer, info = v.carers[c.id];
      row.days += info.count;
      row.due += info.want || 0;
      row.short += Math.max(0, (info.want || 0) - info.count);
      row.overtime += Math.max(0, info.count - Number(c.daysPerWeek || 0));
      const weekend = info.days[5] || info.days[6];
      row.weekendsTotal++;
      if (weekend) { row.weekendsWorked++; row.run++; row.longestWeekendRun = Math.max(row.longestWeekendRun, row.run); } else row.run = 0;
      for (let d = 0; d < 7; d++) {
        const date = addDays(ws, d), l = leaveOn(c, date);
        if (l && l.type === 'SICK') row.sickDays++;
        if (l && l.type === 'AL') row.leaveDays++;
        if (state.runs.some(r => r.days[d] && week.cells[r.id] && week.cells[r.id][d] && week.cells[r.id][d].shadow && week.cells[r.id][d].shadow.c === c.id)) row.shadowDays++;
      }
    }
  }
  rows.forEach(r => delete r.run);
  return { weeks: list, rows };
}

// ---- Carer spreadsheet import / export ----
// One row per carer. Blank cells keep the carer's current value (or the default for a new carer).
const CARER_COLUMNS = [
  { key: 'name', head: 'Name', match: /^name/, help: 'Full name. Rows are matched to existing carers by name, so this updates them.' },
  { key: 'gender', head: 'Gender (M/F)', match: /^gender|^sex/, help: 'M or F.' },
  { key: 'driver', head: 'Driver (Yes/No)', match: /^driver|^drive/, help: 'Yes if they drive.' },
  { key: 'daysPerWeek', head: 'Days per week', match: /^days per week|^days\/week|^contract/, help: 'Contracted days, 0–7 (for agency staff: the most days they can do).' },
  { key: 'overtime', head: 'Agreed +1 overtime day (Yes/No)', match: /overtime/, help: 'Yes if they have agreed to one extra day when needed.' },
  { key: 'runTypes', head: 'Can go on (Both/Doubles/Singles)', match: /^can go on|^run type/, help: 'Both, Doubles (double-ups only) or Singles.' },
  { key: 'available', head: 'Days they can work', match: /^days they can work|^available|^availability/, help: 'All, or days such as "Mon Tue Wed" or "Mon-Fri". Blank = all days.' },
  { key: 'agency', head: 'Agency (Yes/No)', match: /^agency/, help: 'Yes for agency staff (only used to fill gaps).' },
  { key: 'preferredRuns', head: 'Preferred runs', match: /^preferred/, help: 'Run names separated by ; e.g. "Run 2; Run 4". Must match the names on the Runs page.' },
  { key: 'onlyPreferred', head: 'Only preferred runs (Yes/No)', match: /^only/, help: 'Yes if they must only ever work their preferred runs.' },
  { key: 'notWith', head: "Can't work with", match: /^can.?t work with|^not with/, help: 'Names separated by ; – applies both ways.' },
  { key: 'notes', head: 'Notes', match: /^notes?/, help: 'Anything else.' },
  { key: 'traineeUntil', head: 'Trainee until (date)', match: /^trainee/, help: 'For new starters: they only shadow experienced carers up to this date (e.g. 30/11/2026). Blank = not a trainee.' },
];
const EXAMPLE_PREFIX = /^example\s*:/i;

function parseYesNo(v) {
  const t = String(v).trim().toLowerCase();
  if (/^(yes|y|true|1|x|✓|✔)$/.test(t)) return true;
  if (/^(no|n|false|0)$/.test(t)) return false;
  return null;
}

function parseDays(v) {
  const t = String(v).trim().toLowerCase();
  if (!t || t === 'all' || t === 'every day') return DAYS.map(() => true);
  const out = DAYS.map(() => false);
  const idx = w => DAYS.findIndex(d => w.startsWith(d.toLowerCase()));
  for (const part of t.split(/[,;\/\s]+/).filter(Boolean)) {
    const range = part.split(/[-–]/);
    if (range.length === 2) {
      const a = idx(range[0]), b = idx(range[1]);
      if (a < 0 || b < 0) return null;
      for (let i = a; ; i = (i + 1) % 7) { out[i] = true; if (i === b) break; }
    } else {
      const i = idx(part);
      if (i < 0) return null;
      out[i] = true;
    }
  }
  return out;
}

// 'DD/MM/YYYY', 'YYYY-MM-DD' or an Excel date number -> 'YYYY-MM-DD' (or null)
function parseDate(v) {
  const t = String(v).trim();
  let m;
  if ((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  if ((m = t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  if (/^\d{5}(\.\d+)?$/.test(t)) return addDays('1899-12-30', Math.floor(Number(t)));
  return null;
}

function daysText(available) {
  if (available.every(Boolean)) return 'All';
  return DAYS.filter((_, i) => available[i]).join(' ');
}

// Rows (first row = headings) for every carer, in the same layout as the template.
function carersToRows(state) {
  const runName = id => (state.runs.find(r => r.id === id) || {}).name;
  const nameOf = id => (state.carers.find(c => c.id === id) || {}).name;
  const list = state.carers.slice().sort((a, b) => (a.agency ? 1 : 0) - (b.agency ? 1 : 0) || a.name.localeCompare(b.name));
  return [CARER_COLUMNS.map(c => c.head)].concat(list.map(c => [
    c.name, c.gender, c.driver ? 'Yes' : 'No', Number(c.daysPerWeek || 0), c.overtime ? 'Yes' : 'No',
    { double: 'Doubles', single: 'Singles' }[c.runTypes] || 'Both', daysText(c.available), c.agency ? 'Yes' : 'No',
    (c.preferredRuns || []).map(runName).filter(Boolean).join('; '), c.onlyPreferred ? 'Yes' : 'No',
    state.carers.filter(o => cantPair(c, o)).map(o => o.name).join('; '), c.notes || '', c.traineeUntil ? ukDate(c.traineeUntil) : '',
  ]));
}

// Work out what importing these rows would do, without changing anything.
// Returns { add: [carer], update: [{ id, name, fields }], links: [[nameA, nameB]], errors: [], warnings: [], skipped }.
function planCarerImport(state, rows) {
  const plan = { add: [], update: [], links: [], errors: [], warnings: [], skipped: 0, unchanged: 0 };
  const header = (rows[0] || []).map(h => String(h || '').trim().toLowerCase());
  const col = {};
  CARER_COLUMNS.forEach(c => { const i = header.findIndex(h => c.match.test(h)); if (i >= 0) col[c.key] = i; });
  if (col.name === undefined) { plan.errors.push('No "Name" column found – the first row must be the column headings from the template.'); return plan; }
  const byName = new Map(state.carers.map(c => [c.name.trim().toLowerCase(), c]));
  const seen = new Set();
  const preferredLists = [];
  rows.slice(1).forEach((row, i) => {
    const rowNo = i + 2;
    const cell = key => col[key] === undefined ? '' : String(row[col[key]] == null ? '' : row[col[key]]).trim();
    const name = cell('name');
    if (!name) { if (row.some(v => String(v == null ? '' : v).trim())) plan.errors.push(`Row ${rowNo}: no name`); return; }
    if (EXAMPLE_PREFIX.test(name)) { plan.skipped++; return; }
    const key = name.toLowerCase();
    if (seen.has(key)) { plan.errors.push(`Row ${rowNo}: ${name} appears more than once`); return; }
    seen.add(key);
    const f = {}, bad = [];
    const g = cell('gender').toUpperCase();
    if (g) { if (/^(M|MALE)$/.test(g)) f.gender = 'M'; else if (/^(F|FEMALE)$/.test(g)) f.gender = 'F'; else bad.push(`Gender must be M or F (got "${cell('gender')}")`); }
    for (const k of ['driver', 'overtime', 'agency', 'onlyPreferred']) {
      const v = cell(k);
      if (!v) continue;
      const b = parseYesNo(v);
      if (b === null) bad.push(`${CARER_COLUMNS.find(c => c.key === k).head.replace(/ \(.*/, '')} must be Yes or No (got "${v}")`); else f[k] = b;
    }
    const dpw = cell('daysPerWeek');
    if (dpw) { const n = Number(dpw); if (Number.isInteger(n) && n >= 0 && n <= 7) f.daysPerWeek = n; else bad.push(`Days per week must be a whole number 0–7 (got "${dpw}")`); }
    const rt = cell('runTypes').toLowerCase();
    if (rt) { const m = { both: 'both', doubles: 'double', double: 'double', 'double-ups': 'double', singles: 'single', single: 'single' }[rt]; if (m) f.runTypes = m; else bad.push(`Can go on must be Both, Doubles or Singles (got "${cell('runTypes')}")`); }
    if (col.available !== undefined) { const a = parseDays(cell('available')); if (a) f.available = a; else bad.push(`Days they can work not understood ("${cell('available')}") – use e.g. "Mon Tue Wed" or "Mon-Fri"`); }
    const pr = cell('preferredRuns');
    if (pr) {
      const ids = [];
      for (const n of pr.split(/[;,]/).map(x => x.trim()).filter(Boolean)) {
        const run = state.runs.find(r => r.name.trim().toLowerCase() === n.toLowerCase());
        if (run) ids.push(run.id); else plan.warnings.push(`Row ${rowNo}: no run called "${n}" – preferred run ignored`);
      }
      f.preferredRuns = ids;
    }
    if (cell('notes')) f.notes = cell('notes');
    const tu = cell('traineeUntil');
    if (tu) { const iso = parseDate(tu); if (iso) f.traineeUntil = iso; else bad.push(`Trainee until must be a date like 30/11/2026 (got "${tu}")`); }
    if (bad.length) { plan.errors.push(`Row ${rowNo} (${name}): ${bad.join('; ')} – row not imported`); return; }
    for (const other of cell('notWith').split(/[;,]/).map(x => x.trim()).filter(Boolean)) plan.links.push([name, other, rowNo]);
    const existing = byName.get(key);
    if (existing) {
      // only what actually differs from what is already set
      const was = k => existing[k] === undefined ? { driver: false, overtime: false, agency: false, onlyPreferred: false, runTypes: 'both', preferredRuns: [], notes: '' }[k] : existing[k];
      const changed = Object.keys(f).filter(k => JSON.stringify(f[k]) !== JSON.stringify(was(k)));
      const fields = Object.fromEntries(changed.map(k => [k, f[k]]));
      const labels = changed.map(k => CARER_COLUMNS.find(c => c.key === k).head.replace(/ \(.*/, '').toLowerCase());
      if (changed.length) plan.update.push({ id: existing.id, name: existing.name, fields, labels });
      else plan.unchanged++;
    }
    else {
      if (!f.gender) { plan.errors.push(`Row ${rowNo} (${name}): Gender is needed for a new carer – row not imported`); return; }
      plan.add.push(Object.assign({ id: uid(), name, gender: 'F', driver: false, daysPerWeek: 5, overtime: false, runTypes: 'both',
        available: DAYS.map(() => true), leave: [], notes: '', active: true, agency: false }, f));
    }
  });
  const known = new Set(state.carers.map(c => c.name.trim().toLowerCase()).concat(plan.add.map(c => c.name.toLowerCase())));
  const findExisting = n => state.carers.find(c => c.name.trim().toLowerCase() === n.toLowerCase());
  plan.links = plan.links.filter(([a, b, rowNo]) => {
    if (!known.has(b.toLowerCase())) {
      plan.warnings.push(`Row ${rowNo}: no carer called "${b}" – "can't work with" ignored`);
      return false;
    }
    const ca = findExisting(a), cb = findExisting(b);
    return !(ca && cb && cantPair(ca, cb)); // already set
  });
  for (const [a, b] of plan.links) {
    for (const n of [a, b]) {
      const u = plan.update.find(x => x.name.toLowerCase() === n.toLowerCase());
      const ex = findExisting(n);
      if (u && !u.labels.includes("can't work with")) u.labels.push("can't work with");
      else if (!u && ex) { plan.update.push({ id: ex.id, name: ex.name, fields: {}, labels: ["can't work with"] }); plan.unchanged = Math.max(0, plan.unchanged - 1); }
    }
  }
  return plan;
}

function applyCarerImport(state, plan) {
  state.carers.push(...plan.add);
  for (const u of plan.update) Object.assign(state.carers.find(c => c.id === u.id), u.fields);
  const find = n => state.carers.find(c => c.name.trim().toLowerCase() === n.toLowerCase());
  for (const [a, b] of plan.links) {
    const ca = find(a), cb = find(b);
    if (!ca || !cb || ca === cb) continue;
    ca.notWith = [...new Set((ca.notWith || []).concat(cb.id))];
    cb.notWith = [...new Set((cb.notWith || []).concat(ca.id))];
  }
}

// Checks every cell of the week against the rules. Returns { cells: {key: [issue]}, list: [issue], carers: {...} }.
function validate(state, weekStart) {
  const week = getWeek(state, weekStart);
  const byId = Object.fromEntries(state.carers.map(c => [c.id, c]));
  const cells = {};
  const list = [];
  const add = (runId, d, level, msg) => {
    const key = runId + '|' + d;
    (cells[key] || (cells[key] = [])).push({ level, msg });
    const run = state.runs.find(r => r.id === runId);
    list.push({ level, msg: `${run ? run.name : '?'} ${DAYS[d]}: ${msg}` });
  };

  // where each carer is placed per day
  const placements = DAYS.map(() => ({}));
  for (const run of state.runs) {
    for (let d = 0; d < 7; d++) {
      if (!run.days[d]) continue;
      for (const id of cellCarers(getCell(week, run, d))) {
        (placements[d][id] || (placements[d][id] = [])).push(run.id);
      }
    }
  }

  for (const run of state.runs) {
    for (let d = 0; d < 7; d++) {
      if (!run.days[d]) continue;
      const cell = getCell(week, run, d);
      const assigned = cell.slots.filter(s => s.c);
      const missing = cell.slots.length - assigned.length;
      if (missing) add(run.id, d, 'error', `${missing} carer(s) needed`);
      if (needsDriver(run) && assigned.length && !assigned.some(s => byId[s.c] && byId[s.c].driver)) add(run.id, d, 'error', 'No driver');
      const people = cell.slots.map(s => ({ s, role: '' })).concat(cell.shadow && cell.shadow.c ? [{ s: cell.shadow, role: ' (shadow)' }] : []);
      people.forEach(({ s }, i) => people.slice(i + 1).forEach(({ s: t }) => {
        const a = byId[s.c], b = byId[t.c];
        if (a && b && cantPair(a, b)) {
          const over = s.override || t.override;
          add(run.id, d, over ? 'warn' : 'error', `${a.name} and ${b.name} can't work together${over ? ' (overridden)' : ''}`);
        }
      }));
      for (const { s, role } of people) {
        if (!s.c) continue;
        const c = byId[s.c];
        if (!c) { add(run.id, d, 'error', 'Unknown carer'); continue; }
        if (!genderOk(run, c)) add(run.id, d, 'error', `${c.name}${role}: run is ${run.gender === 'M' ? 'male' : 'female'} only`);
        if (!role && inTraining(c, addDays(weekStart, d))) add(run.id, d, 'warn', `${c.name}: trainee until ${ukDate(c.traineeUntil)} – should be shadowing`);
        if (!role && !preferredOk(run, c)) add(run.id, d, s.override ? 'warn' : 'error', `${c.name}: only works ${preferredNames(c, state.runs)}${s.override ? ' (overridden)' : ''}`);
        if (!role && !runTypeOk(run, c)) add(run.id, d, s.override ? 'warn' : 'error', `${c.name}: ${runTypesLabel(c).toLowerCase()}${s.override ? ' (overridden)' : ''}`);
        if (!role && !allowedOk(run, c)) add(run.id, d, s.override ? 'warn' : 'error', `${c.name}: not on this run's carer list${s.override ? ' (overridden)' : ''}`);
        const st = carerStatus(c, weekStart, d);
        if (!st.ok) add(run.id, d, s.override ? 'warn' : 'error', `${c.name}${role}: ${st.label}${s.override ? ' (overridden)' : ''}`);
        if ((placements[d][c.id] || []).length > 1) add(run.id, d, 'error', `${c.name}${role}: double booked on ${DAYS[d]}`);
      }
    }
  }

  const hist = history(state, weekStart);
  const nextWeek = weekDays(state, addDays(weekStart, 7));
  const carers = {};
  for (const c of state.carers) {
    const days = DAYS.map((_, d) => (placements[d][c.id] || []).length > 0);
    const n = days.filter(Boolean).length;
    const h = hist[c.id];
    const ws = weekendStreak(h);
    const runsThisWeek = new Set(DAYS.flatMap((_, d) => placements[d][c.id] || []));
    carers[c.id] = { days, count: n, contracted: Number(c.daysPerWeek || 0), history: h, weekendStreak: ws, rotation: rotation(h), runsThisWeek };
    carers[c.id].agency = !!c.agency;
    if (!c.agency && state.settings.weekendRule !== false && (days[5] || days[6])) {
      if (ws >= 2) list.push({ level: 'error', msg: `${c.name}: would be a 3rd weekend in a row – needs this weekend off` });
    }
    const maxInARow = Number(state.settings.maxInARow) || 0;
    if (maxInARow && n) {
      const next = nextWeek[c.id];
      const stretch = longestStretch(d => d < 0 ? !!h.days[h.days.length + d] : d > 6 ? next[d - 7] : days[d]);
      if (stretch > maxInARow) list.push({ level: 'error', msg: `${c.name}: ${stretch} days in a row (maximum ${maxInARow})` });
    }
    if (n) {
      const next = nextWeek[c.id];
      const working = d => d < 0 ? !!h.days[h.days.length + d] : d > 6 ? next[d - 7] : days[d];
      for (const b of restBreaches(working, -7 * HISTORY_WEEKS, 13)) {
        if (b.back < 0 || b.back > 6) continue; // reported in the week they go back to work
        list.push({ level: 'error', msg: `${c.name}: back on ${DAYS[b.back]} after ${b.length} days in a row – needs ${REST_DAYS} days off in a row first` });
      }
    }
    const avail = DAYS.filter((_, d) => carerStatus(c, weekStart, d).ok).length;
    const want = Math.min(Number(c.daysPerWeek || 0), avail);
    carers[c.id].want = want;
    days.forEach((on, d) => {
      if (on && requestOn(c, addDays(weekStart, d))) list.push({ level: 'warn', msg: `${c.name}: asked for ${DAYS[d]} ${ukDate(addDays(weekStart, d)).slice(0, 5)} off` });
    });
    if (c.active !== false && !c.agency && n < want) {
      list.push({ level: 'warn', msg: `${c.name}: ${7 - n} days off – profile allows ${7 - want} (${want - n} day(s) short)` });
    }
    if (n > capacity(c, true)) list.push({ level: 'error', msg: `${c.name}: ${n} days booked, maximum is ${capacity(c, true)}` });
    else if (n > capacity(c, false)) list.push({ level: 'warn', msg: `${c.name}: working an overtime day (${n} days)` });
  }
  return { cells, list, carers };
}

// ---- What carers were sent, and what has changed since ----
// For each carer working this week: [7 × 'runId' | 'S:runId' (shadow) | null].
function weekPlan(state, weekStart) {
  const week = getWeek(state, weekStart), plan = {};
  for (const run of state.runs) {
    for (let d = 0; d < 7; d++) {
      if (!run.days[d]) continue;
      const cell = getCell(week, run, d);
      const mark = (id, v) => { (plan[id] || (plan[id] = DAYS.map(() => null)))[d] = v; };
      cell.slots.forEach(sl => { if (sl.c) mark(sl.c, run.id); });
      if (cell.shadow && cell.shadow.c) mark(cell.shadow.c, 'S:' + run.id);
    }
  }
  return plan;
}

// Remember what was shared (a PDF or printed carer rota) so later changes can be listed.
function markShared(state, weekStart) {
  getWeek(state, weekStart).shared = { at: new Date().toISOString(), plan: weekPlan(state, weekStart) };
}

// Changes since the week was last shared: [{ carer, d, was, now }] (was/now are descriptions), or null if never shared.
function changesSinceShared(state, weekStart) {
  const shared = getWeek(state, weekStart).shared;
  if (!shared) return null;
  const now = weekPlan(state, weekStart), out = [];
  const describe = v => {
    if (!v) return 'Day off';
    const shadow = v.startsWith('S:'), run = state.runs.find(r => r.id === (shadow ? v.slice(2) : v));
    return `${run ? run.name : 'a run that was removed'}${shadow ? ' (shadowing)' : ''}`;
  };
  for (const c of state.carers) {
    const a = shared.plan[c.id] || DAYS.map(() => null), b = now[c.id] || DAYS.map(() => null);
    for (let d = 0; d < 7; d++) if (a[d] !== b[d]) out.push({ carer: c, d, was: describe(a[d]), now: describe(b[d]) });
  }
  return out;
}

// Where a carer is on a day: { run, cell, idx } (idx = 'shadow' for the shadow place), or null.
function spotOf(state, weekStart, carerId, d) {
  const week = getWeek(state, weekStart);
  for (const run of state.runs) {
    if (!run.days[d]) continue;
    const cell = getCell(week, run, d);
    const idx = cell.slots.findIndex(sl => sl.c === carerId);
    if (idx >= 0) return { run, cell, idx };
    if (cell.shadow && cell.shadow.c === carerId) return { run, cell, idx: 'shadow' };
  }
  return null;
}

// Swap shifts: B takes A's shift on day dA and, when dB is given, A takes B's shift on day dB (dB === dA swaps runs).
// Tried on a copy first. Returns { error } or { text, problems: [new rule problems], apply(state) }.
function planSwap(state, weekStart, aId, dA, bId, dB) {
  const name = id => (state.carers.find(c => c.id === id) || {}).name || '?';
  const run = (st, id, d) => spotOf(st, weekStart, id, d);
  if (aId === bId) return { error: 'Choose two different carers.' };
  if (!run(state, aId, dA)) return { error: `${name(aId)} isn't working ${DAYS[dA]}.` };
  if (dB != null && !run(state, bId, dB)) return { error: `${name(bId)} isn't working ${DAYS[dB]}.` };
  const doIt = st => {
    const a = run(st, aId, dA), b = dB != null ? run(st, bId, dB) : null;
    const put = (spot, id) => {
      if (spot.idx === 'shadow') spot.cell.shadow = { c: id, override: false };
      else spot.cell.slots[spot.idx] = { c: id, locked: true, override: false };
    };
    put(a, bId);
    if (b) put(b, aId);
  };
  const errors = st => new Set(validate(st, weekStart).list.filter(i => i.level === 'error').map(i => i.msg));
  const before = errors(state);
  const trial = JSON.parse(JSON.stringify(state));
  doIt(trial);
  const problems = [...errors(trial)].filter(m => !before.has(m));
  const ra = run(state, aId, dA).run.name, rb = dB != null ? run(state, bId, dB).run.name : null;
  const text = dB == null ? `${name(bId)} takes ${name(aId)}'s ${DAYS[dA]} shift (${ra}).`
    : dA === dB ? `${name(aId)} and ${name(bId)} swap runs on ${DAYS[dA]}: ${name(aId)} goes to ${rb}, ${name(bId)} to ${ra}.`
    : `${name(bId)} takes ${name(aId)}'s ${DAYS[dA]} (${ra}); ${name(aId)} takes ${name(bId)}'s ${DAYS[dB]} (${rb}).`;
  return { text, problems, apply: doIt };
}

// Mark a carer off sick from `from` to `to` (YYYY-MM-DD) and take them off every shift in that period.
// Returns the slots that were emptied: [{ week, runId, d, idx }].
function reportSickness(state, carerId, from, to) {
  const carer = state.carers.find(c => c.id === carerId);
  if (!carer || !from) return [];
  if (!to || to < from) to = from;
  carer.leave = (carer.leave || []).concat([{ type: 'SICK', from, to }]);
  const emptied = [];
  for (const ws of Object.keys(state.weeks).sort()) {
    for (let d = 0; d < 7; d++) {
      const date = addDays(ws, d);
      if (date < from || date > to) continue;
      for (const run of state.runs) {
        if (!run.days[d]) continue;
        const cell = getCell(state.weeks[ws], run, d);
        cell.slots.forEach((sl, idx) => {
          if (sl.c !== carerId) return;
          Object.assign(sl, { c: null, locked: false, override: false });
          emptied.push({ week: ws, runId: run.id, d, idx });
        });
        if (cell.shadow && cell.shadow.c === carerId) cell.shadow = { c: null, override: false };
      }
    }
  }
  return emptied;
}

// Who could cover an empty slot. Each carer is tried in the slot and the week re-checked: anyone who would
// create a new rule problem is ruled out (with that problem as the reason). The rest are ranked: regular staff
// before agency, no overtime before overtime, most days short of their profile first, then working the
// day before/after, then preferred run. Returns { ok: [{ carer, notes }], no: [{ carer, reason }] }.
function suggestCover(state, weekStart, runId, d, idx) {
  const run = state.runs.find(r => r.id === runId);
  const week = getWeek(state, weekStart);
  const cell = run && run.days[d] && getCell(week, run, d);
  const slot = cell && cell.slots[idx];
  if (!slot || slot.c) return { ok: [], no: [] };
  const otherEmpty = cell.slots.some((sl, i) => i !== idx && !sl.c);
  const problems = v => new Set(v.list.filter(i => i.level === 'error' && !/carer\(s\) needed/.test(i.msg) &&
    !(otherEmpty && /No driver/.test(i.msg))).map(i => i.msg));
  const before = validate(state, weekStart);
  const base = problems(before);
  const ok = [], no = [];
  for (const c of state.carers.filter(c => c.active !== false)) {
    slot.c = c.id;
    let fresh;
    try { fresh = [...problems(validate(state, weekStart))].filter(m => !base.has(m)); } finally { slot.c = null; }
    if (fresh.length) {
      const reason = fresh[0].replace(new RegExp(`^.* (${DAYS.join('|')}): `), '').replace(`${c.name}: `, '')
        .replace(/^double booked on (\w+)$/, 'already working $1')
        .replace(/^(\d+) days booked, maximum is (\d+)$/, 'would be $1 days this week (maximum $2)');
      no.push({ carer: c, reason });
      continue;
    }
    const b = before.carers[c.id];
    const short = c.agency ? 0 : Math.max(0, (b.want || 0) - b.count);
    const overtime = !c.agency && b.count + 1 > Number(c.daysPerWeek || 0);
    const near = [d - 1, d + 1].filter(e => e >= 0 && e <= 6 && b.days[e]);
    const sameRun = near.some(e => run.days[e] && getCell(week, run, e).slots.some(sl => sl.c === c.id));
    const preferred = (c.preferredRuns || []).includes(run.id);
    const notes = [];
    if (c.agency) notes.push('agency');
    if (short) notes.push(`${short} day(s) short`);
    if (overtime) notes.push('overtime day');
    if (sameRun) notes.push('on this run the day before/after');
    else if (near.length) notes.push('working the day before/after');
    if (preferred) notes.push('preferred run');
    ok.push({ carer: c, notes, rank: [c.agency ? 1 : 0, overtime ? 1 : 0, -short, sameRun ? 0 : near.length ? 1 : 2, preferred ? 0 : 1] });
  }
  ok.sort((a, b) => {
    for (let i = 0; i < a.rank.length; i++) if (a.rank[i] !== b.rank[i]) return a.rank[i] - b.rank[i];
    return a.carer.name.localeCompare(b.carer.name);
  });
  return { ok: ok.map(({ carer, notes }) => ({ carer, notes })), no };
}

if (typeof module !== 'undefined') {
  module.exports = { requestOn, onPattern, weekPlan, markShared, changesSinceShared, planSwap, inTraining, autoFillWeeks, leaveImpact, fairnessReport, CARER_COLUMNS, carersToRows, planCarerImport, applyCarerImport, parseDays, fillGaps, reportSickness, suggestCover, prefersRun, cantPair, DAYS, HISTORY_WEEKS, weekDays, longestStretch, restBreaches, ROTATION_WEEKS, history, weekendStreak, rotation, uid, addDays, mondayOf, newState, getWeek, getCell, carerStatus, capacity, autoFill, validate, clearUnlocked };
}
// ===== ENGINE END =====
</script>

<script>
// ===== UI =====
const STORE_KEY = 'careschedule.v1';
// In the desktop app (desktop/ folder) data is kept in a file via window.careDesktop; opened as a plain
// web page it is kept in the browser's storage.
const desktop = window.careDesktop || null;
let dataProblem = null; // set when saved data couldn't be read, so we don't overwrite it

let deskInfo = desktop ? desktop.info() : null; // data folder, and whether this computer can edit
const holderText = () => deskInfo && deskInfo.holder ? `${deskInfo.holder.user} on ${deskInfo.holder.computer}` : 'another computer';
let state = load();
let ui = { find: null, carerView: null, carerViewWeeks: 6, swapForm: null, planCount: 4, leaveForm: null, leaveWeeks: 8, reportWeeks: 13, printWhat: 'runs', importPlan: null, tab: 'schedule', week: mondayOf(todayIso()), editCarer: null, editRun: null, report: null, sickForm: null, cover: [] };

function load() {
  try {
    const raw = desktop ? desktop.load() : localStorage.getItem(STORE_KEY);
    if (raw) return withDefaults(JSON.parse(raw));
  } catch (e) {
    console.warn('Could not load saved data', e);
    dataProblem = e.message || String(e);
  }
  return newState();
}
function withDefaults(data) {
  const s = newState();
  for (const c of data.carers || []) delete c.weekendPriority; // replaced by the automatic weekend-off flag
  return Object.assign(s, data, { settings: Object.assign(s.settings, data.settings) });
}
// The data as saved: weeks and shifts with nobody on them are left out (just looking at a week creates them),
// so browsing never counts as a change.
function stateJson(st) {
  return JSON.stringify(st, (k, v) => {
    if (k === 'shadowOpen') return undefined;
    if (k !== 'weeks' || !v) return v;
    const weeks = {};
    for (const [ws, w] of Object.entries(v)) {
      const cells = {};
      for (const [runId, byDay] of Object.entries(w.cells || {})) {
        const days = {};
        for (const [d, cell] of Object.entries(byDay)) if (cell.slots.some(sl => sl.c) || (cell.shadow && cell.shadow.c)) days[d] = cell;
        if (Object.keys(days).length) cells[runId] = days;
      }
      if (Object.keys(cells).length || w.final) weeks[ws] = Object.assign({}, w, { cells });
    }
    return weeks;
  });
}

// Undo: every saved change keeps the version before it (up to UNDO_LIMIT).
const UNDO_LIMIT = 30;
const undoStack = [];
let lastSaved = stateJson(state);

let saveFailed = false;
function save(fromUndo) {
  if (dataProblem) return; // never overwrite data we couldn't read
  const json = stateJson(state);
  if (json === lastSaved) return;
  if (deskInfo && deskInfo.mode === 'view') {
    // someone else is editing: put things back and say why
    state = withDefaults(JSON.parse(lastSaved));
    alert(`View only – ${holderText()} has CareSchedule open, so changes here can't be saved.\n\nThis screen updates when they save. Once they close CareSchedule you can edit (or press "Try again").`);
    return;
  }
  if (!fromUndo) { undoStack.push(lastSaved); if (undoStack.length > UNDO_LIMIT) undoStack.shift(); }
  lastSaved = json;
  try {
    if (desktop) {
