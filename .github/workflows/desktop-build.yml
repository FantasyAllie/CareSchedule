name: Build desktop app

# Builds the Windows installer and the Mac app on GitHub's own Windows and Mac machines.
# - Every change to the app on main (and on pull requests): download the files from the run's "Artifacts" section.
# - Pushing a tag like v1.0.0, or running this workflow by hand with a version filled in (Actions → Build desktop
#   app → Run workflow): the files are also published as a GitHub Release with that version.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Version to publish as a Release, e.g. v1.0.0 (leave blank to just build)'
        required: false
        default: ''
  pull_request:
    paths: ['CareSchedule.html', 'desktop/**', '.github/workflows/desktop-build.yml']
  push:
    branches: [main]
    paths: ['CareSchedule.html', 'desktop/**', '.github/workflows/desktop-build.yml']
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Check the scheduling rules
        run: node ../tests/engine.test.js
      - name: Build
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: CareSchedule-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          name: CareSchedule ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: out/*
          body: |
            **Windows:** download `CareSchedule-Setup-….exe` and run it. If Windows says "Windows protected your PC", click **More info → Run anyway** (the app isn't code-signed).

            **Mac:** download `CareSchedule-…-mac.dmg`, open it and drag CareSchedule into Applications. The first time, right-click the app and choose **Open**. If macOS says it is "damaged", run `xattr -cr /Applications/CareSchedule.app` in Terminal, then open it again.

            Your data is kept in `Documents/CareSchedule` (or the folder chosen in Settings & Data → Change data folder…). To bring data over from the browser version: Export backup there, Import backup in the app.
