name: Build desktop app

# Builds the Windows installer and the Mac app on GitHub's own Windows and Mac machines.
# - Every change to the app on main (and on pull requests): download the files from the run's "Artifacts" section.
# - Pushing a tag like v1.0.0: the files are also attached to a GitHub Release.
on:
  workflow_dispatch:
  pull_request:
    paths: ['CareSchedule.html', 'desktop/**', '.github/workflows/desktop-build.yml']
  push:
    branches: [main]
    paths: ['CareSchedule.html', 'desktop/**', '.github/workflows/desktop-build.yml']
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Check the scheduling rules
        run: node ../tests/engine.test.js
      - name: Build
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: CareSchedule-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
